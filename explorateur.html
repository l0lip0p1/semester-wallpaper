<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<title>Explorateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fit: 1;
  --top-space: 20dvh;
  --bottom-space: 19dvh;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#stage {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  box-sizing: border-box;
  padding: var(--top-space) 6vw var(--bottom-space);
  display: flex; flex-direction: column; justify-content: center;
  gap: calc(3.2dvh * var(--fit));
  transition: transform 6s linear;
}
#stage > * { flex-shrink: 0; }
#night { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #000000; opacity: 0; transition: opacity 90s linear; }
:root[data-power="saver"] *, :root[data-power="saver"] *::before, :root[data-power="saver"] *::after { animation-play-state: paused !important; }

body { background: #050b14; color: #d8fbff; font-family: "Silkscreen", "Courier New", monospace; }
#stage { justify-content: flex-end; padding-left: 7vw; padding-right: 7vw; }
.cap { align-self: flex-start; margin: 0; padding: 6px 9px; border-radius: 4px; background: rgba(3, 8, 15, 0.72); font-size: 11px; line-height: 1.6; color: rgba(216, 251, 255, 0.78); letter-spacing: 0.04em; }
.cap b { font-weight: 400; color: #6fe3e1; }
.cap .dim { color: rgba(216, 251, 255, 0.42); }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <p class="cap" role="img" aria-label="A pixel cave generated by a cellular automaton, explored by the A star search algorithm"><b>Explorateur</b><br><span id="stat"></span><br><span class="dim">cave: cellular automaton, search: A*</span></p>
</main>

<div id="night"></div>

<script>
/* ---------- art core: animation loop, battery modes, night dimming, drift (no timetable) ---------- */
const Art = (() => {
  "use strict";
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  let power = (window.__power && window.__power.mode) || "full";
  root.dataset.power = power;
  window.addEventListener("wallpaper-power", (e) => {
    power = (e.detail && e.detail.mode) || "full";
    root.dataset.power = power;
  });
  const NIGHT_FROM = 23 * 60, NIGHT_TO = 7 * 60, NIGHT_BRIGHTNESS = 0.45;
  let night = null;
  function updateNight() {
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    const n = m >= NIGHT_FROM || m < NIGHT_TO;
    if (n !== night) {
      night = n;
      root.classList.toggle("night", n);
      $("night").style.opacity = n ? String(1 - NIGHT_BRIGHTNESS) : "0";
    }
  }
  const share = () => (power === "saver" ? 0.2 : power === "eco" ? 0.5 : 1);
  const frameSkip = () => (power === "saver" ? 4 : power === "eco" || night ? 2 : 1);
  const driftAt = (t) => [Math.sin(t / 173) * 6, Math.cos(t / 241) * 8];
  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function start(design) {
    const cvs = $("fx"), ctx = cvs.getContext("2d"), stage = $("stage");
    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      design.resize(W, H, dpr);
    }
    let last = 0, frameNo = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      frameNo++;
      if (frameNo % frameSkip()) return;
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
      last = ts;
      if (!W) return;
      const [dx, dy] = driftAt(Date.now() / 1000);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.translate(dx, dy);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      design.frame(ctx, dt, ts / 1000, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
    function drift() {
      const [dx, dy] = driftAt(Date.now() / 1000);
      if (stage) stage.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    }
    updateNight(); setInterval(updateNight, 30000);
    drift(); setInterval(drift, 6000);
    resize();
    window.addEventListener("resize", resize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(frame);
  }
  return { start, $, TAU, share, reduce, get power() { return power; }, get night() { return !!night; } };
})();

/* ---------- Explorateur: a new cave is generated, A* searches it, then a lamp walks the path ---------- */
(() => {
  "use strict";
  const A = Art, $ = A.$, CELL = 6;
  let W = 0, H = 0, gw = 0, gh = 0, wall = null, px = null, pctx = null, img = null;
  let start = 0, goal = 0, open = null, came = null, g = null, closed = null, seen = null, heapA = [];
  let phase = "search", path = [], step = 0, hold = 0, fade = 1, explored = 0, timer = 0, lampAt = -1;
  const idx = (x, y) => y * gw + x;

  /* the cave: random fill, smoothed by the 4-5 cellular automaton rule, keep the largest open region */
  function makeCave() {
    let m = new Uint8Array(gw * gh);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) m[idx(x, y)] = (x === 0 || y === 0 || x === gw - 1 || y === gh - 1 || Math.random() < 0.46) ? 1 : 0;
    for (let it = 0; it < 5; it++) {
      const n = new Uint8Array(gw * gh);
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        let c = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx, yy = y + dy;
          c += (xx < 0 || yy < 0 || xx >= gw || yy >= gh) ? 1 : m[idx(xx, yy)];
        }
        n[idx(x, y)] = c >= 5 ? 1 : 0;
      }
      m = n;
    }
    // largest connected open region
    const label = new Int32Array(gw * gh).fill(-1);
    let best = -1, bestSize = 0, id = 0;
    for (let i = 0; i < m.length; i++) {
      if (m[i] || label[i] >= 0) continue;
      const stack = [i]; label[i] = id; let size = 0;
      while (stack.length) {
        const c = stack.pop(); size++;
        const x = c % gw, y = (c / gw) | 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const xx = x + dx, yy = y + dy;
          if (xx < 0 || yy < 0 || xx >= gw || yy >= gh) continue;
          const j = idx(xx, yy);
          if (!m[j] && label[j] < 0) { label[j] = id; stack.push(j); }
        }
      }
      if (size > bestSize) { bestSize = size; best = id; }
      id++;
    }
    for (let i = 0; i < m.length; i++) if (!m[i] && label[i] !== best) m[i] = 1;
    // entrance: the highest open cell; goal: the deepest one
    let top = -1, bottom = -1;
    for (let i = 0; i < m.length; i++) if (!m[i]) { if (top < 0) top = i; bottom = i; }
    wall = m; start = top; goal = bottom;
    // shaft from the surface down to the entrance
    for (let y = 0; y < ((top / gw) | 0); y++) wall[idx(top % gw, y)] = 0;
    start = top % gw;                       // start at the very top row
  }

  /* A* with a binary heap, a few nodes per frame so you can watch it think */
  const h = (i) => Math.abs((i % gw) - (goal % gw)) + Math.abs(((i / gw) | 0) - ((goal / gw) | 0));
  function push(i, f) { heapA.push([f, i]); let k = heapA.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heapA[p][0] <= heapA[k][0]) break; [heapA[p], heapA[k]] = [heapA[k], heapA[p]]; k = p; } }
  function pop() {
    const top = heapA[0], last = heapA.pop();
    if (heapA.length) { heapA[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heapA.length && heapA[l][0] < heapA[m][0]) m = l; if (r < heapA.length && heapA[r][0] < heapA[m][0]) m = r; if (m === k) break; [heapA[m], heapA[k]] = [heapA[k], heapA[m]]; k = m; } }
    return top[1];
  }
  function begin() {
    makeCave();
    g = new Float32Array(gw * gh).fill(Infinity); came = new Int32Array(gw * gh).fill(-1);
    closed = new Uint8Array(gw * gh); seen = new Float32Array(gw * gh);
    heapA = []; g[start] = 0; push(start, h(start));
    phase = "search"; path = []; step = 0; hold = 0; explored = 0; fade = 0; lampAt = -1;
  }
  function searchStep() {
    if (!heapA.length) { phase = "done"; return; }
    const c = pop();
    if (closed[c]) return;
    closed[c] = 1; explored++; seen[c] = timer;
    if (c === goal) {
      for (let k = c; k >= 0; k = came[k]) path.push(k);
      path.reverse(); phase = "walk"; return;
    }
    const x = c % gw, y = (c / gw) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= gw || yy >= gh) continue;
      const j = idx(xx, yy);
      if (wall[j] || closed[j]) continue;
      const ng = g[c] + 1;
      if (ng < g[j]) { g[j] = ng; came[j] = c; push(j, ng + h(j) * 1.05); }
    }
  }

  function paint() {
    const d = img.data;
    const lx = lampAt >= 0 ? lampAt % gw : -99, ly = lampAt >= 0 ? (lampAt / gw) | 0 : -99;
    for (let i = 0; i < wall.length; i++) {
      const x = i % gw, y = (i / gw) | 0, k = i * 4;
      let r, gg, b;
      if (wall[i]) {
        const rim = (x > 0 && !wall[i - 1]) || (x < gw - 1 && !wall[i + 1]) || (y > 0 && !wall[i - gw]) || (y < gh - 1 && !wall[i + gw]);
        const tex = ((x * 7 + y * 13) % 5 === 0) ? 4 : 0;          // a little grain in the rock
        r = rim ? 34 : 15 + tex; gg = rim ? 78 : 32 + tex; b = rim ? 116 : 54 + tex;
      } else { r = 1; gg = 4; b = 9; }
      if (closed[i]) {                                      // explored cells glow, then cool down
        const age = Math.min(1, (timer - seen[i]) / 4);
        r += (40 - 30 * age); gg += (170 - 120 * age); b += (175 - 115 * age);
      }
      if (lampAt >= 0) {                                    // the lamp lights the passage around it
        const dd = Math.hypot(x - lx, y - ly);
        if (dd < 7) { const q = 1 - dd / 7; r += 150 * q * q; gg += 190 * q * q; b += 200 * q * q; }
      }
      d[k] = Math.min(255, r * fade); d[k + 1] = Math.min(255, gg * fade); d[k + 2] = Math.min(255, b * fade); d[k + 3] = 255;
    }
    for (let s = 0; s < step && s < path.length; s++) { const k = path[s] * 4; d[k] = 216 * fade; d[k + 1] = 251 * fade; d[k + 2] = 255 * fade; }
    for (const i of heapA.slice(0, 400)) { const k = i[1] * 4; d[k] = 111 * fade; d[k + 1] = 227 * fade; d[k + 2] = 225 * fade; }
  }

  const design = {
    resize(w, h) {
      W = w; H = h; gw = Math.ceil(W / CELL); gh = Math.ceil(H / CELL);
      px = document.createElement("canvas"); px.width = gw; px.height = gh;
      pctx = px.getContext("2d"); img = pctx.createImageData(gw, gh);
      begin();
    },
    frame(ctx, dt) {
      if (!wall) return;
      timer += dt;
      fade = Math.min(1, fade + dt / 1.2);
      const speed = A.power === "saver" ? 2 : A.power === "eco" ? 4 : 7;
      if (phase === "search" && !A.reduce) for (let k = 0; k < speed; k++) { searchStep(); if (phase !== "search") break; }
      else if (phase === "walk") { step = Math.min(path.length, step + dt * 9); lampAt = path[Math.min(path.length - 1, Math.floor(step))]; if (step >= path.length) phase = "hold"; }
      else if (phase === "hold" || phase === "done") { hold += dt; if (hold > 6) { fade = Math.max(0, 1 - (hold - 6) / 1.2); if (hold > 7.2) begin(); } }
      paint();
      pctx.putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(px, -CELL, -CELL, (gw + 2) * CELL, (gh + 2) * CELL);
      const txt = phase === "search" ? `searching, ${explored} cells explored` : `${explored} explored, path of ${path.length} steps`;
      if ($("stat").textContent !== txt) $("stat").textContent = txt;
    },
  };
  Art.start(design);
})();
</script>
</body>
</html>
