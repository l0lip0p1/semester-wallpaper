<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fit: 1;
  --top-space: 20dvh;
  --bottom-space: 19dvh;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#stage {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  box-sizing: border-box;
  padding: var(--top-space) 6vw var(--bottom-space);
  display: flex; flex-direction: column; justify-content: center;
  gap: calc(3.2dvh * var(--fit));
  transition: transform 6s linear;
}
#stage > * { flex-shrink: 0; }
#night { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #000000; opacity: 0; transition: opacity 90s linear; }
:root[data-power="saver"] *, :root[data-power="saver"] *::before, :root[data-power="saver"] *::after { animation-play-state: paused !important; }

:root {
  --fg: #c9d1d9;
  --fg-2: #8b949e;
  --fg-3: #484f58;
  --white: #f0f6fc;
  --green: #3fb950;
  --blue: #79c0ff;
  --purple: #d2a8ff;
  --orange: #ffa657;
  --red: #f78166;
  --panel: rgba(13, 17, 23, 0.86);
  --edge: #30363d;
  --g0: #161b22; --g1: #0e4429; --g2: #006d32; --g3: #26a641; --g4: #39d353;
  --fs: calc(clamp(10.5px, 2.95vw, 12.5px) * var(--fit));
}
body { background: #000000; color: var(--fg); font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: var(--fs); font-variant-numeric: tabular-nums; }
#stage { gap: calc(2.6dvh * var(--fit)); padding-left: 5vw; padding-right: 5vw; }

/* contribution graph */
.graph .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.7em; color: var(--fg); }
.graph .head b { color: var(--white); font-weight: 500; }
.months, .cells { display: grid; grid-template-columns: repeat(18, 1fr); column-gap: 3px; }
.months { margin-bottom: 4px; font-size: 0.82em; color: var(--fg-2); height: 1.2em; }
.months span { white-space: nowrap; }
.cells { grid-auto-flow: column; grid-template-rows: repeat(7, auto); row-gap: 3px; }
.cell { aspect-ratio: 1; border-radius: 2px; background: var(--g0); outline: 1px solid rgba(240, 246, 252, 0.04); outline-offset: -1px; }
.cell.l1 { background: var(--g1); } .cell.l2 { background: var(--g2); } .cell.l3 { background: var(--g3); } .cell.l4 { background: var(--g4); }
.cell.future { opacity: 0.32; }
.cell.exam { background: var(--red); }
.cell.deadline { background: var(--orange); }
.cell.today { outline: 1.5px solid var(--white); outline-offset: 0; animation: blink 1.4s steps(1) infinite; }
.legend { display: flex; justify-content: space-between; align-items: center; margin-top: 0.7em; font-size: 0.82em; color: var(--fg-2); }
.legend .scale { display: flex; align-items: center; gap: 3px; }
.legend .scale i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.legend .key { display: flex; align-items: center; gap: 0.45em; }

/* terminal */
.term { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
.term .bar { padding: 0.5em 0.9em; border-bottom: 1px solid var(--edge); color: var(--fg-2); font-size: 0.85em; display: flex; justify-content: space-between; }
.term .bar .pw { color: var(--fg-3); }
.term pre { margin: 0; padding: 0.75em 0.9em 0.85em; font: inherit; line-height: 1.5; white-space: pre; overflow: hidden; }
.p-path { color: var(--blue); }
.p-sign { color: var(--fg-2); }
.cmd { color: var(--white); }
.ok { color: var(--green); }
.dim { color: var(--fg-3); }
.term .dim { color: #262c33; }
.term .line > .dim:only-child { color: var(--fg-3); }
.mut { color: var(--fg-2); }
.wht { color: var(--white); }
.code { color: var(--purple); }
.code.deadline { color: var(--orange); }
.live { color: var(--red); }
.cursor { display: inline-block; width: 0.6em; height: 1.15em; vertical-align: -0.2em; background: var(--fg); animation: blink 1.1s steps(1) infinite; }
.line.hide { visibility: hidden; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
@media (prefers-reduced-motion: reduce) { .cursor, .cell.today { animation: none; } }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <section class="graph" aria-label="Classes this semester, one square per day">
    <div class="head"><span><b id="nClasses">0</b> classes in the last <span id="nWeeks">0</span> weeks</span></div>
    <div class="months" id="months"></div>
    <div class="cells" id="cells"></div>
    <div class="legend">
      <span class="key"><i style="background:var(--red);width:9px;height:9px;border-radius:2px;display:inline-block"></i>exam <i style="background:var(--orange);width:9px;height:9px;border-radius:2px;display:inline-block;margin-left:0.6em"></i>deadline</span>
      <span class="scale">Less <i style="background:var(--g0)"></i><i style="background:var(--g1)"></i><i style="background:var(--g2)"></i><i style="background:var(--g3)"></i><i style="background:var(--g4)"></i> More</span>
    </div>
  </section>

  <section class="term" aria-label="Countdown, courses and exams">
    <div class="bar"><span>student@epfl: ~/semester</span><span class="pw" id="pw"></span></div>
    <pre id="out"></pre>
  </section>
</main>

<div id="night"></div>

<script>
/* =====================================================================
   EDIT HERE: dates, timetable, exams, night mode
   Dates: "YYYY-MM-DD" or "YYYY-MM-DDTHH:MM" (local time)
   ===================================================================== */
const CONFIG = {
  countFrom: "2026-09-07T00:00",          // 0% point of every countdown
  examSessionStart: "2027-01-11T00:00",   // the main ring reaches 100% here

  firstClassDay: "2026-09-07",
  lastClassDay: "2026-12-18",
  noClassDays: ["2026-09-21"],                    // Jeune federal
  noClassRanges: [["2026-10-19", "2026-10-23"]],  // autumn break

  courses: {
    AN:   { name: "Analysis I",                  color: "#8ecbff" },
    AL:   { name: "Linear Algebra",              color: "#ff9ec7" },
    AICC: { name: "AICC I",                      color: "#b8f28a" },
    PHYS: { name: "General physics: mechanics",  color: "#ffc27a" },
    PROG: { name: "Introduction to programming", color: "#c3a6ff" },
  },

  timetable: [
    { day: "Mon", start: "10:15", end: "12:00", course: "AN",   type: "Lecture" },
    { day: "Tue", start: "08:15", end: "10:00", course: "AICC", type: "Lecture" },
    { day: "Tue", start: "10:15", end: "12:00", course: "PHYS", type: "Exercise" },
    { day: "Tue", start: "15:15", end: "17:00", course: "AL",   type: "Lecture" },
    { day: "Wed", start: "10:15", end: "12:00", course: "AN",   type: "Lecture" },
    { day: "Wed", start: "13:15", end: "14:00", course: "PROG", type: "Lecture" },
    { day: "Wed", start: "14:15", end: "15:00", course: "PROG", type: "Lecture" },
    { day: "Wed", start: "15:15", end: "17:00", course: "AICC", type: "Lecture" },
    { day: "Wed", start: "17:15", end: "19:00", course: "PHYS", type: "Lecture" },
    { day: "Thu", start: "08:15", end: "10:00", course: "AL",   type: "Lecture" },
    { day: "Thu", start: "10:15", end: "12:00", course: "AN",   type: "Exercise" },
    { day: "Thu", start: "12:15", end: "14:00", course: "PHYS", type: "Lecture" },
    { day: "Fri", start: "08:15", end: "10:00", course: "AL",   type: "Exercise" },
    { day: "Fri", start: "10:15", end: "12:00", course: "AICC", type: "Exercise" },
    { day: "Fri", start: "13:15", end: "15:00", course: "PROG", type: "Exercise" },
    { day: "Fri", start: "15:15", end: "16:00", course: "PROG", type: "Lab" },
  ],

  // date: null means "date not known yet"
  exams: [
    { label: "PROG", course: "PROG", date: "2026-12-12T09:00" },                      // exam 09:00-12:00
    { label: "PROJ", course: "PROG", date: "2026-12-17T13:00", kind: "deadline" },    // project submission
    { label: "DEF",  course: "PROG", date: "2026-12-18T08:00", kind: "deadline" },    // project defense (time TBD)
    { label: "PHYS", course: "PHYS", date: "2027-01-15T08:00" },                      // exam 08:00-11:30
    { label: "AN",   course: "AN",   date: null },
    { label: "AL",   course: "AL",   date: null },
    { label: "AICC", course: "AICC", date: null },
  ],
  tbdText: "in January",

  nightDim: { from: "23:00", to: "07:00", brightness: 0.45 },
  decimals: { big: 6, live: 6, small: 2, exams: 5 },  // live = the course you are in right now
  particles: 60,

  // free space left for the lock screen clock (top) and charging text / shortcuts (bottom)
  layout: { topSpace: "20dvh", bottomSpace: "19dvh" },
};
/* ===================================================================== */

/* ---------- core: schedule, timing, battery, night and layout (same in every design) ---------- */
const Core = (() => {
  "use strict";
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const pad = (n) => String(n).padStart(2, "0");
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const DAYNUM = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  const SDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const SMONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  root.style.setProperty("--top-space", CONFIG.layout.topSpace);
  root.style.setProperty("--bottom-space", CONFIG.layout.bottomSpace);

  function toTime(s) {
    const [d, t] = s.split("T");
    const [y, m, dd] = d.split("-").map(Number);
    const [hh, mm] = (t || "00:00").split(":").map(Number);
    return new Date(y, m - 1, dd, hh, mm, 0, 0).getTime();
  }
  const ymd = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
  const hm = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const shortDate = (t) => { const d = new Date(t); return `${d.getDate()} ${SMONTHS[d.getMonth()]}`; };

  /* schedule */
  const START = toTime(CONFIG.countFrom);
  const SESSION = toTime(CONFIG.examSessionStart);
  const off = new Set(CONFIG.noClassDays);
  for (const [a, b] of CONFIG.noClassRanges) {
    const d = new Date(toTime(a)); const end = toTime(b);
    while (d.getTime() <= end) { off.add(ymd(d)); d.setDate(d.getDate() + 1); }
  }
  const sessions = [];
  {
    const d = new Date(toTime(CONFIG.firstClassDay));
    const last = toTime(CONFIG.lastClassDay);
    while (d.getTime() <= last) {
      if (!off.has(ymd(d))) {
        for (const s of CONFIG.timetable) {
          if (DAYNUM[s.day] !== d.getDay()) continue;
          const [sh, sm] = s.start.split(":").map(Number);
          const [eh, em] = s.end.split(":").map(Number);
          sessions.push({
            course: s.course, type: s.type,
            start: new Date(d.getFullYear(), d.getMonth(), d.getDate(), sh, sm).getTime(),
            end: new Date(d.getFullYear(), d.getMonth(), d.getDate(), eh, em).getTime(),
          });
        }
      }
      d.setDate(d.getDate() + 1);
    }
  }
  sessions.sort((a, b) => a.start - b.start);
  const totals = {};
  for (const s of sessions) totals[s.course] = (totals[s.course] || 0) + (s.end - s.start);
  function courseProgress(code, now) {
    let done = 0;
    for (const s of sessions) {
      if (s.course !== code) continue;
      if (now >= s.end) done += s.end - s.start;
      else if (now > s.start) done += now - s.start;
    }
    return totals[code] ? done / totals[code] : 0;
  }

  /* exams */
  const examList = CONFIG.exams
    .map((x, idx) => ({ ...x, idx, t: x.date ? toTime(x.date) : null }))
    .sort((a, b) => (a.t === null || b.t === null) ? (a.t === null) - (b.t === null) || a.idx - b.idx : a.t - b.t);
  const dated = examList.filter((x) => x.t !== null);
  const tbd = examList.filter((x) => x.t === null).map((x) => x.label);
  const tbdText = !tbd.length ? "" :
    `${tbd.length > 1 ? `${tbd.slice(0, -1).join(", ")} and ${tbd[tbd.length - 1]}` : tbd[0]} ${tbd.length > 1 ? "exams: dates" : "exam: date"} ${CONFIG.tbdText}`;

  /* status line */
  function whenLabel(t, now) {
    const d = new Date(t), n = new Date(now);
    const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
    if (diff === 0) return `today ${hm(t)}`;
    if (diff === 1) return `tomorrow ${hm(t)}`;
    if (diff < 7) return `${SDAYS[d.getDay()]} ${hm(t)}`;
    return `${SDAYS[d.getDay()]} ${shortDate(t)}, ${hm(t)}`;
  }
  function status(now, live) {
    if (live) return { live: true, code: live.course, text: `${live.course} ${live.type.toLowerCase()} until ${hm(live.end)}` };
    const next = sessions.find((s) => s.start > now);
    if (next) return { live: false, code: next.course, text: `Next: ${next.course} ${next.type.toLowerCase()}, ${whenLabel(next.start, now)}` };
    if (now < SESSION) return { live: false, code: null, text: `Classes are over. Exams start ${shortDate(SESSION)}.` };
    return { live: false, code: null, text: "Exam session. Good luck." };
  }

  /* one snapshot of everything a design shows */
  function state(now) {
    const live = sessions.find((s) => now >= s.start && now < s.end) || null;
    const courses = Object.keys(CONFIG.courses).map((code) => ({
      code, name: CONFIG.courses[code].name, color: CONFIG.courses[code].color,
      p: courseProgress(code, now), live: !!live && live.course === code,
    }));
    return {
      now, live,
      session: clamp01((now - START) / (SESSION - START)),
      sessionLeft: SESSION - now,
      courses,
      all: courses.reduce((a, c) => a + c.p, 0) / courses.length,
      exams: dated.map((x) => ({
        label: x.label, course: x.course, kind: x.kind || "exam", t: x.t,
        p: clamp01((now - START) / (x.t - START)), left: x.t - now, done: now >= x.t,
      })),
      status: status(now, live),
    };
  }

  /* number helpers */
  function pct(p, dec) {
    if (p >= 1) return ["100", ""];
    const v = (clamp01(p) * 100).toFixed(dec);
    const k = v.indexOf(".");
    return k < 0 ? [v, ""] : [v.slice(0, k), v.slice(k)];
  }
  function parts(ms) {
    let s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    return { d, h, m: Math.floor(s / 60), s: s % 60 };
  }
  function short(ms) {
    const { d, h, m } = parts(ms);
    if (d > 0) return `${d} d ${h} h`;
    if (h > 0) return `${h} h ${pad(m)} m`;
    return `${m} m`;
  }
  const setText = (el, t) => { if (el && el.textContent !== t) el.textContent = t; };
  // fixed-width digits, so ticking numbers never wobble whatever the font
  function setDigits(el, str) {
    if (!el || el._s === str) return;
    el._s = str;
    while (el.children.length < str.length) el.appendChild(document.createElement("span"));
    while (el.children.length > str.length) el.lastChild.remove();
    for (let i = 0; i < str.length; i++) {
      const c = el.children[i];
      if (c.textContent !== str[i]) { c.textContent = str[i]; c.className = /[0-9]/.test(str[i]) ? "" : str[i] === "." ? "pt" : "tx"; }
    }
  }
  function ring(svgParent, r, cls) {
    const ns = "http://www.w3.org/2000/svg";
    const C = TAU * r;
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", "60"); c.setAttribute("cy", "60"); c.setAttribute("r", String(r));
    c.setAttribute("class", cls);
    if (cls.includes("prog")) { c.setAttribute("stroke-dasharray", `${C} ${C}`); c.setAttribute("stroke-dashoffset", String(C)); }
    svgParent.appendChild(c);
    return { el: c, C, last: -1 };
  }
  function setArc(a, p) {
    if (Math.abs(p - a.last) < 0.0006 && !(p >= 1 && a.last < 1)) return;
    a.last = p;
    a.el.setAttribute("stroke-dashoffset", (a.C * (1 - p)).toFixed(3));
    a.el.style.visibility = p <= 0 ? "hidden" : "visible";
  }

  /* battery mode from the app: full, eco or saver */
  let power = (window.__power && window.__power.mode) || "full";
  root.dataset.power = power;
  window.addEventListener("wallpaper-power", (e) => {
    power = (e.detail && e.detail.mode) || "full";
    root.dataset.power = power;
  });
  const share = () => (power === "saver" ? 0.2 : power === "eco" ? 0.5 : 1);

  /* night */
  let night = null;
  const minutesOf = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  function updateNight(d) {
    const m = d.getHours() * 60 + d.getMinutes();
    const f = minutesOf(CONFIG.nightDim.from), t = minutesOf(CONFIG.nightDim.to);
    const n = f > t ? (m >= f || m < t) : (m >= f && m < t);
    if (n !== night) {
      night = n;
      root.classList.toggle("night", n);
      $("night").style.opacity = n ? String(1 - CONFIG.nightDim.brightness) : "0";
    }
  }
  const frameSkip = () => (power === "saver" ? 4 : power === "eco" || night ? 2 : 1);
  const tickMs = () => (power === "saver" ? 500 : night ? 400 : power === "eco" ? 120 : 60);

  /* slow drift against screen burn-in */
  const driftAt = (t) => [Math.sin(t / 173) * 7, Math.cos(t / 241) * 9];

  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function start(design) {
    const stage = $("stage");
    const cvs = $("fx");
    const ctx = cvs.getContext("2d");
    let W = 0, H = 0;

    function fit() {
      const cs = getComputedStyle(stage);
      const kids = [...stage.children];
      const used = () => kids.reduce((h, k) => h + k.offsetHeight, 0) + parseFloat(cs.rowGap || 0) * (kids.length - 1);
      const avail = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      let f = 1;
      root.style.setProperty("--fit", "1");
      while (f > 0.6 && used() > avail) { f -= 0.03; root.style.setProperty("--fit", f.toFixed(2)); }
    }
    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fit();
      if (design.resize) design.resize(W, H);
      if (design.measure) design.measure();
    }
    function drift() {
      const [dx, dy] = driftAt(Date.now() / 1000);
      stage.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    }

    design.setup(state(Date.now()));
    let lastSecond = -1;
    (function loop() {
      const now = Date.now();
      const st = state(now);
      const sec = Math.floor(now / 1000);
      if (sec !== lastSecond) { lastSecond = sec; updateNight(new Date(now)); }
      design.update(st);
      setTimeout(loop, tickMs());
    })();

    let last = 0, frameNo = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      frameNo++;
      if (frameNo % frameSkip()) return;
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
      last = ts;
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      design.frame(ctx, dt, ts / 1000, W, H);
      ctx.globalAlpha = 1;
    }

    drift(); setInterval(drift, 6000);
    resize();
    window.addEventListener("resize", resize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); if (design.measure) design.measure(); });
    if (design.measure) setInterval(design.measure, 1000);
    requestAnimationFrame(frame);
  }

  return {
    sessions, START, SESSION, dated, ymd,
    $, TAU, pad, clamp01, shortDate, hm, pct, parts, short, setText, setDigits, ring, setArc, tbdText,
    start, driftAt, share, reduce,
    get power() { return power; },
    get night() { return !!night; },
  };
})();

/* ---------- Terminal: the semester as a commit graph and a shell session ---------- */
(() => {
  "use strict";
  const C = Core, $ = C.$;
  const lines = [];                 // every terminal line, in order, for the typing replay
  const v = {};                     // live value nodes
  let cellsByDay = [], todayCell = null;
  let typing = false, hiddenAt = 0;

  /* ---------- helpers to write the terminal ---------- */
  const span = (cls, text) => { const s = document.createElement("span"); if (cls) s.className = cls; if (text != null) s.textContent = text; return s; };
  function line(...parts) {
    const l = document.createElement("div");
    l.className = "line";
    for (const p of parts) l.appendChild(typeof p === "string" ? document.createTextNode(p) : p);
    $("out").appendChild(l);
    lines.push({ el: l, cmd: null });
    return l;
  }
  function prompt(cmd) {
    const c = span("cmd", "");
    const l = line(span("p-path", "~/semester"), span("p-sign", " $ "), c);
    lines[lines.length - 1].cmd = { node: c, text: cmd };
    c.textContent = cmd;
    return l;
  }
  function bar(width) {
    const fill = span("ok"), rest = span("dim");
    return { width, fill, rest, nodes: [span("mut", "["), fill, rest, span("mut", "]")] };
  }
  function setBar(b, p) {
    const f = Math.max(0, Math.min(1, p)) * b.width;
    const full = Math.floor(f);
    const s = "█".repeat(full);
    C.setText(b.fill, s);
    C.setText(b.rest, "░".repeat(Math.max(0, b.width - s.length)));
  }
  const pctNodes = () => ({ i: span("wht"), d: span("mut") });
  function setPct(n, p, dec) { const [i, d] = C.pct(p, dec); C.setText(n.i, i); C.setText(n.d, d + "%"); }

  /* ---------- contribution graph: one square per day, 18 weeks from 7 Sep ---------- */
  function buildGraph() {
    const start = new Date(C.START); start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() - ((start.getDay() + 6) % 7));       // Monday of the first week
    const hours = {};
    for (const s of C.sessions) { const k = C.ymd(new Date(s.start)); hours[k] = (hours[k] || 0) + (s.end - s.start) / 3600000; }
    const marks = {};
    for (const x of C.dated) marks[C.ymd(new Date(x.t))] = x.kind === "deadline" ? "deadline" : "exam";
    let lastMonth = -1;
    for (let w = 0; w < 18; w++) {
      const d0 = new Date(start); d0.setDate(start.getDate() + w * 7);
      const m = document.createElement("span");
      // label the week in which a month starts
      for (let k = 0; k < 7; k++) {
        const dd = new Date(d0); dd.setDate(d0.getDate() + k);
        if (dd.getMonth() !== lastMonth) { lastMonth = dd.getMonth(); m.textContent = dd.toLocaleString("en", { month: "short" }); break; }
      }
      $("months").appendChild(m);
      for (let k = 0; k < 7; k++) {
        const dd = new Date(d0); dd.setDate(d0.getDate() + k);
        const key = C.ymd(dd);
        const h = hours[key] || 0;
        const c = document.createElement("i");
        c.className = "cell " + (marks[key] || (h === 0 ? "" : h <= 2 ? "l1" : h <= 4 ? "l2" : h <= 6 ? "l3" : "l4"));
        $("cells").appendChild(c);
        cellsByDay.push({ el: c, key, t: dd.getTime() });
      }
    }
  }
  function updateGraph(now) {
    const today = C.ymd(new Date(now));
    for (const c of cellsByDay) {
      c.el.classList.toggle("future", c.key > today);
      const isToday = c.key === today;
      c.el.classList.toggle("today", isToday);
    }
    let n = 0;
    for (const s of C.sessions) if (s.end <= now) n++;
    C.setText($("nClasses"), String(n));
    const weeks = Math.max(1, Math.ceil((Math.min(now, C.SESSION) - C.START) / (7 * 86400000)));
    C.setText($("nWeeks"), String(weeks));
  }

  /* ---------- typing replay: commands are typed, output appears line by line ---------- */
  function replay() {
    if (typing || C.reduce || C.power === "saver") return;
    typing = true;
    for (const l of lines) { l.el.classList.add("hide"); if (l.cmd) l.cmd.node.textContent = ""; }
    let i = 0;
    const next = () => {
      if (i >= lines.length) { typing = false; return; }
      const l = lines[i++];
      l.el.classList.remove("hide");
      if (!l.cmd) { setTimeout(next, 28); return; }
      let k = 0;
      const type = () => {
        l.cmd.node.textContent = l.cmd.text.slice(0, ++k);
        if (k < l.cmd.text.length) setTimeout(type, 34 + Math.random() * 30);
        else setTimeout(next, 160);
      };
      setTimeout(type, 120);
    };
    next();
  }

  const design = {
    setup(st) {
      buildGraph();
      prompt("./countdown");
      v.bar = bar(24); v.pct = pctNodes();
      line(...v.bar.nodes, " ", v.pct.i, v.pct.d);
      v.left = span("wht"); line(v.left, span("mut", " until the exam session"));
      v.nowTag = span("mut"); v.nowCode = span("live"); v.nowText = span(""); v.nowDot = span("live");
      line(v.nowTag, v.nowCode, v.nowText, v.nowDot);

      prompt("./courses");
      v.courses = st.courses.map((c) => {
        const b = bar(16), n = pctNodes(), tag = span("live");
        line(span("code", c.code.padEnd(5)), ...b.nodes, " ", n.i, n.d, tag);
        return { b, n, tag };
      });
      v.allBar = bar(16); v.all = pctNodes();
      line(span("wht", "all".padEnd(5)), ...v.allBar.nodes, " ", v.all.i, v.all.d);

      prompt("./exams");
      v.exams = st.exams.map((x) => {
        const left = span("wht"), n = pctNodes();
        line(span("code" + (x.kind === "deadline" ? " deadline" : ""), x.label.padEnd(5)), span("mut", C.shortDate(x.t).padEnd(7)), left, " ", n.i, n.d);
        return { left, n };
      });
      if (C.tbdText) line(span("dim", "# " + C.tbdText));

      const end = line(span("p-path", "~/semester"), span("p-sign", " $ "), span("cursor"));
      end.lastChild.textContent = "";

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") hiddenAt = Date.now();
        else if (hiddenAt && Date.now() - hiddenAt > 15000) replay();
      });
      setTimeout(replay, 200);
    },

    update(st) {
      updateGraph(st.now);
      setBar(v.bar, st.session);
      setPct(v.pct, st.session, CONFIG.decimals.big);
      const t = C.parts(st.sessionLeft);
      C.setText(v.left, st.sessionLeft > 0 ? `${t.d}d ${C.pad(t.h)}:${C.pad(t.m)}:${C.pad(t.s)}` : "0d 00:00:00");
      const s = st.status;
      if (s.code) {
        const rest = s.text.slice(s.text.indexOf(s.code) + s.code.length);
        C.setText(v.nowTag, s.live ? "now  " : "next ");
        C.setText(v.nowCode, s.code);
        v.nowCode.className = s.live ? "live" : "code";
        C.setText(v.nowText, rest);
        C.setText(v.nowDot, s.live ? "  ●" : "");
      } else { C.setText(v.nowTag, ""); C.setText(v.nowCode, ""); C.setText(v.nowText, s.text); C.setText(v.nowDot, ""); }

      st.courses.forEach((c, k) => {
        const r = v.courses[k];
        setBar(r.b, c.p);
        setPct(r.n, c.p, c.live ? CONFIG.decimals.live : CONFIG.decimals.small);
        C.setText(r.tag, c.live ? "  ● live" : "");
      });
      setBar(v.allBar, st.all);
      setPct(v.all, st.all, CONFIG.decimals.small);
      st.exams.forEach((x, k) => {
        const r = v.exams[k];
        C.setText(r.left, (x.done ? "done" : C.short(x.left).replace(/ d /, "d ").replace(/ h$/, "h").replace(/ m$/, "m")).padEnd(8));
        setPct(r.n, x.p, CONFIG.decimals.exams);
      });
      C.setText($("pw"), C.power === "full" ? "" : C.power === "eco" ? "eco mode" : "battery saver");
    },

    resize(W, H) {
      nodes.length = 0;
      for (let k = 0; k < 30; k++) nodes.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8 });
    },

    frame(ctx, dt, t, W, H) {
      // a slowly drifting graph with packets travelling along its edges
      const n = Math.max(6, Math.round(nodes.length * C.share()));
      for (let k = 0; k < n; k++) {
        const p = nodes[k];
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
      }
      const D = Math.min(W, H) * 0.32;
      edges.length = 0;
      ctx.lineWidth = 0.7;
      for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
        const dx = nodes[a].x - nodes[b].x, dy = nodes[a].y - nodes[b].y, d = Math.hypot(dx, dy);
        if (d < D) {
          edges.push([a, b]);
          ctx.globalAlpha = (1 - d / D) * 0.16;
          ctx.strokeStyle = "#58a6ff";
          ctx.beginPath(); ctx.moveTo(nodes[a].x, nodes[a].y); ctx.lineTo(nodes[b].x, nodes[b].y); ctx.stroke();
        }
      }
      ctx.fillStyle = "#79c0ff";
      for (let k = 0; k < n; k++) { ctx.globalAlpha = 0.35; ctx.fillRect(nodes[k].x - 1, nodes[k].y - 1, 2, 2); }
      if (C.power !== "saver" && !C.reduce && edges.length && Math.random() < dt * 2.2) {
        const [a, b] = edges[(Math.random() * edges.length) | 0];
        packets.push({ a, b, t: 0, life: 1.1 + Math.random() * 0.8, c: Math.random() < 0.8 ? "#3fb950" : "#d2a8ff" });
      }
      for (let k = packets.length - 1; k >= 0; k--) {
        const p = packets[k];
        p.t += dt;
        if (p.t > p.life || p.a >= n || p.b >= n) { packets.splice(k, 1); continue; }
        const q = p.t / p.life, A = nodes[p.a], B = nodes[p.b];
        const x = A.x + (B.x - A.x) * q, y = A.y + (B.y - A.y) * q;
        ctx.globalAlpha = 0.9 * Math.sin(Math.PI * q);
        ctx.fillStyle = p.c;
        ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
      }
    },
  };
  const nodes = [], edges = [], packets = [];
  Core.start(design);
})();
</script>
</body>
