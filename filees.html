<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Filés d’étoiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fit: 1;
  --top-space: 20dvh;
  --bottom-space: 19dvh;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#stage {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  box-sizing: border-box;
  padding: var(--top-space) 6vw var(--bottom-space);
  display: flex; flex-direction: column; justify-content: center;
  gap: calc(3.2dvh * var(--fit));
  transition: transform 6s linear;
}
#stage > * { flex-shrink: 0; }
#night { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #000000; opacity: 0; transition: opacity 90s linear; }
:root[data-power="saver"] *, :root[data-power="saver"] *::before, :root[data-power="saver"] *::after { animation-play-state: paused !important; }

body { background: #02040a; color: #d8fbff; font-family: "Silkscreen", "Courier New", monospace; }
#stage { justify-content: flex-end; padding-left: 7vw; padding-right: 7vw; }
.cap { align-self: flex-start; margin: 0; padding: 6px 9px; border-radius: 4px; background: rgba(3, 8, 15, 0.72); font-size: 11px; line-height: 1.6; color: rgba(216, 251, 255, 0.78); letter-spacing: 0.04em; }
.cap b { font-weight: 400; color: #6fe3e1; }
.cap .dim { color: rgba(216, 251, 255, 0.42); }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <p class="cap" role="img" aria-label="Pixel star trails turning around the pole star above the cliffs of the Vercors"><b>Filés d’étoiles</b><br><span id="exp"></span><br><span class="dim">Vercors, looking north</span></p>
</main>

<div id="night"></div>

<script>
/* ---------- art core: animation loop, battery modes, night dimming, drift (no timetable) ---------- */
const Art = (() => {
  "use strict";
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  let power = (window.__power && window.__power.mode) || "full";
  root.dataset.power = power;
  window.addEventListener("wallpaper-power", (e) => {
    power = (e.detail && e.detail.mode) || "full";
    root.dataset.power = power;
  });
  const NIGHT_FROM = 23 * 60, NIGHT_TO = 7 * 60, NIGHT_BRIGHTNESS = 0.45;
  let night = null;
  function updateNight() {
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    const n = m >= NIGHT_FROM || m < NIGHT_TO;
    if (n !== night) {
      night = n;
      root.classList.toggle("night", n);
      $("night").style.opacity = n ? String(1 - NIGHT_BRIGHTNESS) : "0";
    }
  }
  const share = () => (power === "saver" ? 0.2 : power === "eco" ? 0.5 : 1);
  const frameSkip = () => (power === "saver" ? 4 : power === "eco" || night ? 2 : 1);
  const driftAt = (t) => [Math.sin(t / 173) * 6, Math.cos(t / 241) * 8];
  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function start(design) {
    const cvs = $("fx"), ctx = cvs.getContext("2d"), stage = $("stage");
    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      design.resize(W, H, dpr);
    }
    let last = 0, frameNo = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      frameNo++;
      if (frameNo % frameSkip()) return;
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
      last = ts;
      if (!W) return;
      const [dx, dy] = driftAt(Date.now() / 1000);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.translate(dx, dy);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      design.frame(ctx, dt, ts / 1000, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
    function drift() {
      const [dx, dy] = driftAt(Date.now() / 1000);
      if (stage) stage.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    }
    updateNight(); setInterval(updateNight, 30000);
    drift(); setInterval(drift, 6000);
    resize();
    window.addEventListener("resize", resize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(frame);
  }
  return { start, $, TAU, share, reduce, get power() { return power; }, get night() { return !!night; } };
})();

/* ---------- Filés d'étoiles: a long exposure of the real sky turning above pixel cliffs ---------- */
(() => {
  "use strict";
  const A = Art, $ = A.$, CELL = 3;
  const SIDEREAL = 2 * Math.PI / 86164;          // the sky turns once every 23 h 56 min
  let W = 0, H = 0, gw = 0, gh = 0, sky = null, sctx = null, land = null, ridge = [];
  let stars = [], pole = [0, 0], lastSky = 0, sat = null, satIn = 20, lamp = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);

  function exposure(now) {                        // how long the "shutter" has been open
    const h = now.getHours() + now.getMinutes() / 60;
    if (h >= 18) return Math.min(6, h - 18);
    if (h < 6) return Math.min(6, h + 6);
    return 3;                                     // by day, show a three-hour exposure
  }

  function build() {
    pole = [gw * 0.42, gh * 0.33];
    stars = [];
    for (let k = 0; k < 260; k++) {
      const r = Math.pow(Math.random(), 0.7) * Math.hypot(gw, gh) * 0.9;
      const b = Math.random();
      stars.push({ r, a0: Math.random() * Math.PI * 2, b: 0.25 + b * b * 0.75, tint: Math.random() });
    }
    // the cliffs: rolling plateau with a flat-topped peak standing out
    ridge = [];
    let y = gh * 0.69;
    for (let x = 0; x < gw; x++) {
      y += (Math.random() - 0.5) * 1.6; y = Math.max(gh * 0.66, Math.min(gh * 0.72, y));
      // a lone table mountain: flat top, sheer walls, scree slopes at its foot
      const d = Math.abs(x - gw * 0.66), tw = gw * 0.075, bw = gw * 0.15, top = gh * 0.55;
      let mesa = Infinity;
      if (d < tw) mesa = top + Math.pow(d / tw, 10) * 3 + (Math.random() < 0.3 ? 1 : 0);
      else if (d < bw) mesa = top + Math.pow((d - tw) / (bw - tw), 0.32) * (y - top) + (Math.random() - 0.5) * 1.5;
      ridge.push(Math.min(y, mesa));
    }
    land = document.createElement("canvas"); land.width = gw; land.height = gh;
    const c = land.getContext("2d");
    for (let x = 0; x < gw; x++) {
      const top = Math.round(ridge[x]);
      c.fillStyle = "#040a12"; c.fillRect(x, top, 1, gh - top);
      c.fillStyle = "#1a4a66"; c.fillRect(x, top, 1, 1);                        // rim of light on the edge

    }
    c.fillStyle = "#0b1c2c";
    for (let k = 0; k < 5; k++) {
      const yy = Math.round(gh * (0.57 + k * 0.022));
      for (let x = 0; x < gw; x++) if (ridge[x] < yy - 1 && Math.abs(x - gw * 0.66) < gw * 0.1 && Math.random() < 0.8) c.fillRect(x, yy, 1, 1);
    }
    // a nearer, darker ridge in front
    for (let x = 0; x < gw; x++) {
      const top = Math.round(gh * 0.86 + Math.sin(x * 0.07) * 3 + Math.sin(x * 0.19) * 1.5);
      c.fillStyle = "#010307"; c.fillRect(x, top, 1, gh - top);
    }
  }

  function drawSky(now) {
    const c = sctx;
    const g = c.createLinearGradient(0, 0, 0, gh * 0.8);
    g.addColorStop(0, "#010208"); g.addColorStop(0.7, "#06122a"); g.addColorStop(1, "#0d2a40");
    c.fillStyle = g; c.fillRect(0, 0, gw, gh);
    const L = exposure(now) * 3600 * SIDEREAL;
    const turn = (now.getTime() / 1000) * SIDEREAL;
    c.lineCap = "round"; c.lineWidth = 1;
    for (const s of stars) {
      const end = s.a0 - turn, startA = end + L;
      const col = s.tint < 0.55 ? [216, 251, 255] : s.tint < 0.85 ? [111, 227, 225] : [140, 180, 255];
      // the arc brightens towards the star's present position
      const parts = 4;
      for (let k = 0; k < parts; k++) {
        const a1 = startA - (L * k) / parts, a2 = startA - (L * (k + 1)) / parts;
        c.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${s.b * (0.25 + 0.75 * (k + 1) / parts)})`;
        c.beginPath(); c.arc(pole[0], pole[1], s.r, a2, a1); c.stroke();
      }
    }
    c.fillStyle = "#ffffff"; c.fillRect(Math.round(pole[0]), Math.round(pole[1]), 1, 1);   // the pole star barely moves
  }

  const design = {
    resize(w, h) {
      W = w; H = h; gw = Math.ceil(W / CELL) + 4; gh = Math.ceil(H / CELL) + 4;
      sky = document.createElement("canvas"); sky.width = gw; sky.height = gh; sctx = sky.getContext("2d");
      build(); lastSky = 0;
    },
    frame(ctx, dt, t) {
      if (!sky) return;
      const now = new Date();
      if (Date.now() - lastSky > 2000) { drawSky(now); lastSky = Date.now(); }
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sky, -2 * CELL, -2 * CELL, gw * CELL, gh * CELL);
      // a satellite crossing now and then
      if (!A.reduce && A.power !== "saver") {
        satIn -= dt;
        if (!sat && satIn <= 0) { sat = { x: -4, y: rnd(gh * 0.08, gh * 0.5), vx: rnd(3, 5), vy: rnd(-0.6, 0.6) }; satIn = rnd(40, 90); }
      }
      if (sat) {
        sat.x += sat.vx * dt; sat.y += sat.vy * dt;
        if (sat.x > gw + 4) sat = null;
        else if (sat.y < ridge[Math.max(0, Math.min(gw - 1, sat.x | 0))]) {
          ctx.fillStyle = "#d8fbff"; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 9);
          ctx.fillRect(Math.round(sat.x) * CELL - 2 * CELL, Math.round(sat.y) * CELL - 2 * CELL, CELL, CELL);
          ctx.globalAlpha = 1;
        }
      }
      ctx.drawImage(land, -2 * CELL, -2 * CELL, gw * CELL, gh * CELL);
      // a caver's lamp walking slowly along the plateau
      if (!A.reduce) lamp = (lamp + dt * 0.25) % (gw * 0.5);
      const lx = Math.round(gw * 0.08 + lamp), ly = Math.round(ridge[lx]) - 1;
      const g = ctx.createRadialGradient((lx - 1.5) * CELL, (ly - 1.5) * CELL, 0, (lx - 1.5) * CELL, (ly - 1.5) * CELL, 14);
      g.addColorStop(0, "rgba(160,240,255,0.35)"); g.addColorStop(1, "rgba(160,240,255,0)");
      ctx.fillStyle = g; ctx.fillRect((lx - 1.5) * CELL - 14, (ly - 1.5) * CELL - 14, 28, 28);
      ctx.fillStyle = "#d8fbff"; ctx.fillRect((lx - 2) * CELL, (ly - 2) * CELL, CELL, CELL);
      const e = exposure(now), txt = `exposure ${Math.floor(e)} h ${String(Math.round((e % 1) * 60)).padStart(2, "0")} min`;
      if ($("exp").textContent !== txt) $("exp").textContent = txt;
    },
  };
  Art.start(design);
})();
</script>
</body>
</html>
