          package io.github.semesterwallpaper;

          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          // Reads the timetable straight from the CONFIG block of a design that has one,
          // so there is a single place to edit it: the designs themselves.
          final class Schedule {
              static final Pattern SLOT = Pattern.compile(
                      "\\{\\s*day:\\s*\"(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\",\\s*start:\\s*\"(\\d{1,2}):(\\d{2})\",\\s*end:\\s*\"(\\d{1,2}):(\\d{2})\","
                      + "\\s*course:\\s*\"([^\"]+)\",\\s*type:\\s*\"([^\"]+)\"\\s*\\}");
              static final Pattern FIRST = Pattern.compile("firstClassDay:\\s*\"(\\d{4})-(\\d{2})-(\\d{2})\"");
              static final Pattern LAST = Pattern.compile("lastClassDay:\\s*\"(\\d{4})-(\\d{2})-(\\d{2})\"");
              static final Pattern OFF_DAYS = Pattern.compile("noClassDays:\\s*\\[([^\\]]*)\\]");
              static final Pattern OFF_RANGES = Pattern.compile("noClassRanges:\\s*\\[([^\\n]*)");
              static final Pattern DATE = Pattern.compile("\"(\\d{4})-(\\d{2})-(\\d{2})\"");
              static final Pattern RANGE = Pattern.compile("\\[\\s*\"(\\d{4})-(\\d{2})-(\\d{2})\"\\s*,\\s*\"(\\d{4})-(\\d{2})-(\\d{2})\"\\s*\\]");

              static final class Slot {
                  int dow, start, end;
                  String course, type;
              }

              static final class Now {
                  long start, end;
                  String course, type;
              }

              private static int loadedHash = 0;
              private static final List<Slot> slots = new ArrayList<Slot>();
              private static int first = 0, last = 0;
              private static final Set<Integer> offDays = new HashSet<Integer>();
              private static final List<int[]> offRanges = new ArrayList<int[]>();

              private Schedule() { }

              static boolean hasTimer(String html) {
                  return html != null && SLOT.matcher(html).find();
              }

              private static int key(int y, int m, int d) {
                  return y * 10000 + m * 100 + d;
              }

              private static int dow(String d) {
                  if ("Mon".equals(d)) return Calendar.MONDAY;
                  if ("Tue".equals(d)) return Calendar.TUESDAY;
                  if ("Wed".equals(d)) return Calendar.WEDNESDAY;
                  if ("Thu".equals(d)) return Calendar.THURSDAY;
                  if ("Fri".equals(d)) return Calendar.FRIDAY;
                  if ("Sat".equals(d)) return Calendar.SATURDAY;
                  return Calendar.SUNDAY;
              }

              private static synchronized void load(String html) {
                  int h = html.hashCode();
                  if (h == loadedHash) return;
                  loadedHash = h;
                  slots.clear(); offDays.clear(); offRanges.clear();
                  Matcher m = SLOT.matcher(html);
                  while (m.find()) {
                      Slot s = new Slot();
                      s.dow = dow(m.group(1));
                      s.start = Integer.parseInt(m.group(2)) * 60 + Integer.parseInt(m.group(3));
                      s.end = Integer.parseInt(m.group(4)) * 60 + Integer.parseInt(m.group(5));
                      s.course = m.group(6);
                      s.type = m.group(7);
                      slots.add(s);
                  }
                  m = FIRST.matcher(html);
                  first = m.find() ? key(Integer.parseInt(m.group(1)), Integer.parseInt(m.group(2)), Integer.parseInt(m.group(3))) : 0;
                  m = LAST.matcher(html);
                  last = m.find() ? key(Integer.parseInt(m.group(1)), Integer.parseInt(m.group(2)), Integer.parseInt(m.group(3))) : 99999999;
                  m = OFF_DAYS.matcher(html);
                  if (m.find()) {
                      Matcher d = DATE.matcher(m.group(1));
                      while (d.find()) offDays.add(key(Integer.parseInt(d.group(1)), Integer.parseInt(d.group(2)), Integer.parseInt(d.group(3))));
                  }
                  m = OFF_RANGES.matcher(html);
                  if (m.find()) {
                      Matcher r = RANGE.matcher(m.group(1));
                      while (r.find()) {
                          offRanges.add(new int[] {
                              key(Integer.parseInt(r.group(1)), Integer.parseInt(r.group(2)), Integer.parseInt(r.group(3))),
                              key(Integer.parseInt(r.group(4)), Integer.parseInt(r.group(5)), Integer.parseInt(r.group(6))) });
                      }
                  }
              }

              // The class happening right now, or null.
              static synchronized Now current(String html, long now) {
                  if (html == null) return null;
                  load(html);
                  Calendar cal = Calendar.getInstance();
                  cal.setTimeInMillis(now);
                  int k = key(cal.get(Calendar.YEAR), cal.get(Calendar.MONTH) + 1, cal.get(Calendar.DAY_OF_MONTH));
                  if (k < first || k > last || offDays.contains(k)) return null;
                  for (int[] r : offRanges) if (k >= r[0] && k <= r[1]) return null;
                  int dow = cal.get(Calendar.DAY_OF_WEEK);
                  int minutes = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE);
                  for (Slot s : slots) {
                      if (s.dow != dow || minutes < s.start || minutes >= s.end) continue;
                      Now n = new Now();
                      Calendar c2 = (Calendar) cal.clone();
                      c2.set(Calendar.SECOND, 0);
                      c2.set(Calendar.MILLISECOND, 0);
                      c2.set(Calendar.HOUR_OF_DAY, s.start / 60);
                      c2.set(Calendar.MINUTE, s.start % 60);
                      n.start = c2.getTimeInMillis();
                      c2.set(Calendar.HOUR_OF_DAY, s.end / 60);
                      c2.set(Calendar.MINUTE, s.end % 60);
                      n.end = c2.getTimeInMillis();
                      n.course = s.course;
                      n.type = s.type;
                      return n;
                  }
                  return null;
              }
          }
