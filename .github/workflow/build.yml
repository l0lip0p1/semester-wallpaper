              </div>
              <p class="note" id="classState"></p>
            </section>

            <section class="info" aria-labelledby="shufTitle">
              <h2 id="shufTitle">Shuffle</h2>
              <p>Switch to another design at random every:</p>
              <div class="chips" id="chips" role="radiogroup" aria-labelledby="shufTitle"></div>
              <div class="row">
                <p id="nextChange">Shuffle is off.</p>
                <button class="link" id="now" type="button">Change now</button>
              </div>
            </section>

            <section class="info">
              <h2 id="powerTitle">Battery</h2>
              <p id="powerText"></p>
            </section>

            <section class="info">
              <div class="row">
                <div>
                  <h2>New designs</h2>
                  <p id="checked">Not checked yet</p>
                </div>
                <button class="link" id="refresh" type="button">Check now</button>
              </div>
            </section>
          </div>

          <script>
          (() => {
            "use strict";
            const A = window.Android;
            const $ = (id) => document.getElementById(id);
            const cards = new Map(); // file -> { el, card, shuf, iframe, html }
            let picked = null;
            const INTERVALS = [[0, "Off"], [5, "5 min"], [15, "15 min"], [60, "1 h"], [180, "3 h"], [360, "6 h"], [1440, "1 day"]];

            const POWER_TEXT = {
              full: "Full animation.",
              eco: "Lighter animation to save battery: half the particles and frame rate.",
              saver: "Minimal animation to save battery.",
            };

            const rotation = () => { try { return JSON.parse(A.rotation()); } catch (e) { return { minutes: 0, at: 0, exclude: [] }; } };

            function render() {
              let list = [];
              try { list = JSON.parse(A.designs()); } catch (e) { list = []; }
              const inUse = A.selected();
              if (!picked || !list.some((d) => d.file === picked)) picked = inUse;
              const box = $("cards");
              if (!list.length) { box.innerHTML = '<p class="empty">No designs yet. Check your connection, then tap “Check now”.</p>'; return; }
              const keep = new Set(list.map((d) => d.file));
              for (const [file, c] of cards) if (!keep.has(file)) { c.el.remove(); cards.delete(file); }
              if (box.querySelector(".empty")) box.innerHTML = "";

              list.forEach((d, idx) => {
                let c = cards.get(d.file);
                if (!c) {
                  const el = document.createElement("div");
                  el.className = "item"; el.setAttribute("role", "listitem");
                  el.innerHTML = '<button class="card" type="button"><div class="frame"><iframe tabindex="-1" aria-hidden="true"></iframe></div><div class="name"><span class="title"></span><span class="tag"></span></div></button>' +
                    '<button class="shuf" type="button" role="checkbox"><span class="box"></span><span>In shuffle</span></button>';
                  const card = el.querySelector(".card"), shuf = el.querySelector(".shuf");
                  card.addEventListener("click", () => { picked = d.file; update(); });
                  shuf.addEventListener("click", () => {
                    A.setInRotation(d.file, shuf.getAttribute("aria-checked") !== "true");
                    update();
                  });
                  c = { el, card, shuf, iframe: el.querySelector("iframe"), html: null };
                  cards.set(d.file, c);
                }
                if (box.children[idx] !== c.el) box.insertBefore(c.el, box.children[idx] || null);
                c.el.querySelector(".title").textContent = d.title;
                const html = A.html(d.file);
                if (html !== c.html) {
                  c.html = html;
                  c.iframe.onload = () => {
                    try {
                      const w = c.iframe.contentWindow;
                      w.__power = { mode: "eco" };
                      w.dispatchEvent(new w.CustomEvent("wallpaper-power", { detail: w.__power }));
                    } catch (e) { /* preview keeps full animation */ }
                  };
                  c.iframe.srcdoc = html;
                }
              });
              scale();
              update();
            }

            function scale() {
              for (const c of cards.values()) {
                const w = c.el.querySelector(".frame").clientWidth;
                if (w) c.iframe.style.transform = `scale(${w / 384})`;
              }
            }

            function buildChips() {
              const box = $("chips");
              for (const [min, label] of INTERVALS) {
                const b = document.createElement("button");
                b.type = "button"; b.className = "chip"; b.setAttribute("role", "radio"); b.dataset.min = String(min);
                b.textContent = label;
                b.addEventListener("click", () => { A.setRotation(min); update(); });
                box.appendChild(b);
              }
            }

            function fmtLeft(ms) {
              const m = Math.max(1, Math.round(ms / 60000));
              if (m < 60) return `${m} min`;
              const h = Math.floor(m / 60), r = m % 60;
              return r ? `${h} h ${r} min` : `${h} h`;
            }

            function update() {
              const inUse = A.selected();
              const active = A.active();
              const rot = rotation();
              const excluded = new Set(rot.exclude || []);
              for (const [file, c] of cards) {
                c.card.setAttribute("aria-pressed", String(file === picked));
                c.el.querySelector(".tag").textContent = file === inUse && active ? "In use" : file === inUse ? "Chosen" : "";
                c.shuf.hidden = !rot.minutes;
                c.shuf.setAttribute("aria-checked", String(!excluded.has(file)));
              }
              const use = $("use");
              use.disabled = picked === inUse;
              use.textContent = picked === inUse ? (active ? "In use" : "Chosen") : "Use this design";
              $("set").hidden = active;
              $("sub").textContent = active ? "Pick a design. Your wallpaper switches right away." : "Pick a design, then set it as your wallpaper.";

              for (const b of $("chips").children) b.setAttribute("aria-checked", String(Number(b.dataset.min) === rot.minutes));
              const inPool = [...cards.keys()].filter((f) => !excluded.has(f)).length;
              if (!rot.minutes) $("nextChange").textContent = "Shuffle is off.";
              else if (inPool < 2) $("nextChange").textContent = "Pick at least two designs to shuffle between.";
              else $("nextChange").textContent = `Next change in ${fmtLeft(rot.at + rot.minutes * 60000 - Date.now())}.`;
              $("now").disabled = inPool < 2;
              showClass();
              showPower();
            }

            function showClass() {
              const on = A.classMode();
              $("classMode").setAttribute("aria-checked", String(on));
              let list = [];
              try { list = JSON.parse(A.designs()); } catch (e) { list = []; }
              const names = list.filter((d) => d.timer).map((d) => d.title);
              const named = names.length > 1 ? `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}` : names[0] || "none yet";
              let now = { now: false };
              try { now = JSON.parse(A.classNow()); } catch (e) { /* not in class */ }
              const until = now.now ? new Date(now.end).toTimeString().slice(0, 5) : "";
              const state = !on ? "Off." : now.now ? `You’re in ${now.course} (${now.type.toLowerCase()}) until ${until}, so a design with the timer is showing.` : "Not in class right now.";
              $("classState").textContent = `${state} Designs with the timer: ${named}.`;
            }

            function showPower() {
              let p = { mode: "full", level: 100, charging: false, powerSave: false };
              try { p = JSON.parse(A.power()); } catch (e) { /* keep defaults */ }
              const state = p.charging ? `Charging, ${p.level}%` : p.powerSave ? `Power saving mode on, ${p.level}%` : `${p.level}%`;
              $("powerTitle").textContent = `Battery: ${state}`;
              $("powerText").textContent = `${POWER_TEXT[p.mode] || POWER_TEXT.full} Full animation while charging or above 50%, lighter between 20 and 50%, minimal below 20% or in power saving mode.`;
            }

            function showChecked(ok) {
              const t = Number(A.checked()) || 0;
              if (ok === false) { $("checked").textContent = "Couldn’t reach GitHub. Showing saved designs."; return; }
              if (!t) { $("checked").textContent = "Checking…"; return; }
              const min = Math.round((Date.now() - t) / 60000);
              $("checked").textContent = min < 1 ? "Up to date, checked just now" : `Up to date, checked ${min} min ago`;
            }

            $("use").addEventListener("click", () => {
              A.choose(picked);
              if (!A.active()) A.setWallpaper();
              update();
            });
            $("set").addEventListener("click", () => { A.choose(picked); A.setWallpaper(); });
            $("refresh").addEventListener("click", () => { $("checked").textContent = "Checking…"; A.refresh(); });
            $("now").addEventListener("click", () => { A.shuffleNow(); picked = A.selected(); update(); });
            $("classMode").addEventListener("click", () => { A.setClassMode(!A.classMode()); update(); });

            window.onDesigns = (ok) => { render(); showChecked(ok); };
            window.onShow = () => { picked = A.selected(); update(); showChecked(); };
            window.addEventListener("resize", scale);
            setInterval(update, 30000);

            buildChips();
            render();
            showChecked();
          })();
          </script>
          </body>
          </html>
          EOF

          # every .html file at the root of the repository is a design; bundle them for offline use
          for f in *.html; do
            [ -f "$f" ] && cp "$f" app/assets/designs/
          done
          ls app/assets/designs
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#; s#__BRANCH__#${GITHUB_REF_NAME}#" app/src/io/github/semesterwallpaper/Store.java
          grep -n "static final String REPO\|static final String BRANCH" app/src/io/github/semesterwallpaper/Store.java

      - name: Get the signing key
        run: |
          if [ ! -f wallpaper-key.p12 ]; then
            keytool -genkeypair -keystore wallpaper-key.p12 -storetype PKCS12 \
              -storepass semester -keypass semester -alias wallpaper \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Semester Wallpaper"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          BT="$SDK/build-tools/34.0.0"
          JAR="$SDK/platforms/android-34/android.jar"
          cd app
          mkdir -p build/compiled build/classes
          for f in $(find res -type f); do
            "$BT/aapt2" compile -o build/compiled "$f"
          done
          "$BT/aapt2" link -o build/base.apk -I "$JAR" --manifest AndroidManifest.xml -A assets \
            --min-sdk-version 26 --target-sdk-version 34 \
            --version-code "$GITHUB_RUN_NUMBER" --version-name "1.$GITHUB_RUN_NUMBER" \
            build/compiled/*.flat
          javac -source 8 -target 8 -bootclasspath "$JAR" -encoding UTF-8 -d build/classes \
            $(find src -name '*.java')
          "$BT/d8" --release --min-api 26 --lib "$JAR" --output build $(find build/classes -name '*.class')
          (cd build && zip -q -u base.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk
          "$BT/apksigner" sign --ks ../wallpaper-key.p12 --ks-pass pass:semester --key-pass pass:semester \
            --ks-key-alias wallpaper --out ../semester-wallpaper.apk build/aligned.apk
          "$BT/apksigner" verify ../semester-wallpaper.apk
          ls -l ../semester-wallpaper.apk

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" semester-wallpaper.apk \
            --title "Semester wallpaper ${GITHUB_RUN_NUMBER}" \
            --notes "Open this page on your phone and tap semester-wallpaper.apk to install it." \
            --latest
          if [ "${NEW_KEY:-0}" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add wallpaper-key.p12
            git commit -m "Save the signing key so updates install over the old app"
            git push || echo "Could not save the signing key"
          fi
