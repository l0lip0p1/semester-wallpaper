name: Build wallpaper app

on:
  push:
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write the app
        run: |
          mkdir -p app/src/io/github/semesterwallpaper app/res/drawable app/res/xml app/assets/designs

          cat > app/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="io.github.semesterwallpaper">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <application
                  android:label="Semester Wallpaper"
                  android:icon="@drawable/ic"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".ChooserActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Black.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".WallpaperSvc"
                      android:exported="true"
                      android:label="Semester Wallpaper"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/res/xml/wallpaper.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:thumbnail="@drawable/ic" />
          EOF

          cat > app/res/drawable/ic.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z" />
              <path android:strokeColor="#3300E5FF" android:strokeWidth="7"
                  android:pathData="M54,28 a26,26 0 1,1 -0.01,0" />
              <path android:strokeColor="#FF2BD6" android:strokeWidth="7" android:strokeLineCap="round"
                  android:pathData="M54,28 A26,26 0 1,1 28,54" />
          </vector>
          EOF

          cat > app/src/io/github/semesterwallpaper/Store.java <<'EOF'
          package io.github.semesterwallpaper;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.BatteryManager;
          import android.os.PowerManager;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Random;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          // Shared by the wallpaper and the chooser: which designs exist (every .html file at the
          // root of the GitHub repository), their saved copies, the chosen one, and the battery mode.
          final class Store {
              static final String REPO = "__REPO__";
              static final String BRANCH = "__BRANCH__";
              static final String DEFAULT = "index.html";
              static final Pattern NAME = Pattern.compile("[A-Za-z0-9._-]+\\.html");
              static final Pattern TITLE = Pattern.compile("<title>([^<]*)</title>", Pattern.CASE_INSENSITIVE);

              private Store() { }

              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("wallpaper", Context.MODE_PRIVATE);
              }

              static boolean valid(String file) {
                  return file != null && NAME.matcher(file).matches();
              }

              static String selected(Context c) {
                  String f = prefs(c).getString("design", DEFAULT);
                  return valid(f) ? f : DEFAULT;
              }

              static void choose(Context c, String file) {
                  // choosing by hand also restarts the shuffle timer
                  long now = System.currentTimeMillis();
                  if (valid(file)) prefs(c).edit().putString("design", file).putLong("rotatedAt", now).putLong("manualAt", now).apply();
              }

              static File dir(Context c) {
                  File d = new File(c.getFilesDir(), "designs");
                  if (!d.exists()) d.mkdirs();
                  return d;
              }

              static String readAll(InputStream in) throws Exception {
                  try {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return new String(out.toByteArray(), "UTF-8");
                  } finally {
                      in.close();
                  }
              }

              static String read(Context c, String file) {
                  if (!valid(file)) file = DEFAULT;
                  try {
                      File f = new File(dir(c), file);
                      if (f.exists()) return readAll(new FileInputStream(f));
                  } catch (Exception ignored) { }
                  try {
                      return readAll(c.getAssets().open("designs/" + file));
                  } catch (Exception ignored) { }
                  if (!DEFAULT.equals(file)) return read(c, DEFAULT);
                  return "<!doctype html><html><body style=\"background:#000\"></body></html>";
              }

              // Saves a design; returns true if it changed. Wallpapers listen to "rev" and reload.
              static boolean save(Context c, String file, String html) {
                  if (!valid(file)) return false;
                  File f = new File(dir(c), file);
                  try {
                      if (f.exists() && html.equals(readAll(new FileInputStream(f)))) return false;
                      FileOutputStream out = new FileOutputStream(f);
                      try {
                          out.write(html.getBytes("UTF-8"));
                      } finally {
                          out.close();
                      }
                      prefs(c).edit().putLong("rev", System.currentTimeMillis()).apply();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              static String get(String url, boolean api) {
                  HttpURLConnection conn = null;
                  try {
                      conn = (HttpURLConnection) new URL(url).openConnection();
                      conn.setConnectTimeout(10000);
                      conn.setReadTimeout(15000);
                      conn.setUseCaches(false);
                      conn.setRequestProperty("User-Agent", "semester-wallpaper");
                      if (api) conn.setRequestProperty("Accept", "application/vnd.github+json");
                      if (conn.getResponseCode() != 200) return null;
                      return readAll(conn.getInputStream());
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              static String download(String file) {
                  if (!valid(file)) return null;
                  String html = get("https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/" + file
                          + "?t=" + System.currentTimeMillis(), false);
                  return html != null && html.contains("</html>") ? html : null;
              }

              static List<String> listRemote() {
                  String json = get("https://api.github.com/repos/" + REPO + "/contents/?ref=" + BRANCH, true);
                  if (json == null) return null;
                  try {
                      JSONArray arr = new JSONArray(json);
                      List<String> out = new ArrayList<String>();
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          String name = o.optString("name");
                          if ("file".equals(o.optString("type")) && valid(name)) out.add(name);
                      }
                      return out;
                  } catch (Exception e) {
                      return null;
                  }
              }

              static void sort(List<String> list) {
                  Collections.sort(list);
                  if (list.remove(DEFAULT)) list.add(0, DEFAULT);
              }

              static List<String> listLocal(Context c) {
                  List<String> out = new ArrayList<String>();
                  String saved = prefs(c).getString("list", null);
                  if (saved != null && saved.length() > 0) {
                      for (String s : saved.split(",")) if (valid(s)) out.add(s);
                  } else {
                      try {
                          String[] bundled = c.getAssets().list("designs");
                          if (bundled != null) for (String s : bundled) if (valid(s)) out.add(s);
                      } catch (Exception ignored) { }
                  }
                  if (out.isEmpty()) out.add(DEFAULT);
                  sort(out);
                  return out;
              }

              // Downloads the list of designs and every design. Returns false if GitHub can't be reached.
              static boolean refreshAll(Context c) {
                  List<String> list = listRemote();
                  if (list == null) return false;
                  sort(list);
                  StringBuilder names = new StringBuilder();
                  for (String f : list) {
                      String html = download(f);
                      if (html != null) save(c, f, html);
                      if (names.length() > 0) names.append(',');
                      names.append(f);
                  }
                  prefs(c).edit().putString("list", names.toString()).putLong("checked", System.currentTimeMillis()).apply();
                  return true;
              }

              static String title(String html, String fallback) {
                  Matcher m = TITLE.matcher(html);
                  return m.find() ? m.group(1).trim() : fallback;
              }

              /* ---------- shuffle: switch to a random design every N minutes (0 = off) ---------- */

              static int rotateMinutes(Context c) {
                  return prefs(c).getInt("rotate", 0);
              }

              static void setRotateMinutes(Context c, int minutes) {
                  prefs(c).edit().putInt("rotate", Math.max(0, minutes)).putLong("rotatedAt", System.currentTimeMillis()).apply();
              }

              static Set<String> excluded(Context c) {
                  Set<String> out = new HashSet<String>();
                  String s = prefs(c).getString("exclude", "");
                  if (s != null) for (String f : s.split(",")) if (valid(f)) out.add(f);
                  return out;
              }

              static void setInRotation(Context c, String file, boolean in) {
                  if (!valid(file)) return;
                  Set<String> ex = excluded(c);
                  if (in) ex.remove(file); else ex.add(file);
                  StringBuilder sb = new StringBuilder();
                  for (String f : ex) { if (sb.length() > 0) sb.append(','); sb.append(f); }
                  prefs(c).edit().putString("exclude", sb.toString()).apply();
              }

              static boolean available(Context c, String file) {
                  if (new File(dir(c), file).exists()) return true;
                  try {
                      String[] bundled = c.getAssets().list("designs");
                      if (bundled != null) for (String s : bundled) if (file.equals(s)) return true;
                  } catch (Exception ignored) { }
                  return false;
              }

              static String pickNext(Context c) {
                  return pick(c, false);
              }

              // A random design other than the current one; timerOnly keeps the ones that show the timetable.
              static String pick(Context c, boolean timerOnly) {
                  String current = selected(c);
                  Set<String> ex = excluded(c);
                  List<String> pool = new ArrayList<String>(), timers = new ArrayList<String>();
                  for (String f : listLocal(c)) {
                      if (f.equals(current) || !available(c, f)) continue;
                      boolean t = !timerOnly || isTimer(c, f);
                      if (t) timers.add(f);
                      if (t && !ex.contains(f)) pool.add(f);
                  }
                  if (pool.isEmpty() && timerOnly) pool = timers;   // in class, any timer design beats none
                  if (pool.isEmpty()) return null;
                  return pool.get(new Random().nextInt(pool.size()));
              }

              /* ---------- during class: show a design with the timer ---------- */

              private static final java.util.Map<String, Boolean> timerCache = new java.util.HashMap<String, Boolean>();

              static boolean isTimer(Context c, String file) {
                  File f = new File(dir(c), file);
                  String key = file + ":" + (f.exists() ? f.lastModified() : 0L);
                  synchronized (timerCache) {
                      Boolean b = timerCache.get(key);
                      if (b == null) { b = Schedule.hasTimer(read(c, file)); timerCache.put(key, b); }
                      return b;
                  }
              }

              static boolean classMode(Context c) {
                  return prefs(c).getBoolean("classMode", true);
              }

              static void setClassMode(Context c, boolean on) {
                  prefs(c).edit().putBoolean("classMode", on).apply();
              }

              static Schedule.Now classNow(Context c) {
                  for (String f : listLocal(c)) {
                      if (!available(c, f) || !isTimer(c, f)) continue;
                      return Schedule.current(read(c, f), System.currentTimeMillis());
                  }
                  return null;
              }

              // Called by the wallpaper every 30 s and when the screen turns on or off.
              static void tick(Context c) {
                  SharedPreferences p = prefs(c);
                  long now = System.currentTimeMillis();
                  Schedule.Now cls = classMode(c) ? classNow(c) : null;
                  if (cls != null) {
                      if (p.getLong("manualAt", 0L) >= cls.start) return;          // you picked something during this class
                      String cur = selected(c);
                      boolean due = rotateMinutes(c) > 0 && now - p.getLong("rotatedAt", 0L) >= rotateMinutes(c) * 60000L;
                      if (!isTimer(c, cur) || due) {
                          String next = pick(c, true);
                          SharedPreferences.Editor e = p.edit().putLong("rotatedAt", now);
                          if (next != null) {
                              if (!p.getBoolean("classSwitched", false)) e.putString("beforeClass", cur).putLong("classSwitchedAt", now);
                              e.putString("design", next).putBoolean("classSwitched", true);
                          }
                          e.apply();
                      }
                      return;
                  }
                  if (p.getBoolean("classSwitched", false)) {                     // the class is over
                      SharedPreferences.Editor e = p.edit().putBoolean("classSwitched", false);
                      boolean pickedSince = p.getLong("manualAt", 0L) >= p.getLong("classSwitchedAt", 0L);
                      if (!pickedSince) {
                          String back = rotateMinutes(c) > 0 ? pick(c, false) : p.getString("beforeClass", null);
                          if (valid(back) && available(c, back)) e.putString("design", back).putLong("rotatedAt", now);
                      }
                      e.apply();
                      return;
                  }
                  rotateIfDue(c);
              }

              static boolean shuffleNow(Context c) {
                  String next = pickNext(c);
                  if (next == null) return false;
                  prefs(c).edit().putString("design", next).putLong("rotatedAt", System.currentTimeMillis()).apply();
                  return true;
              }

              static void rotateIfDue(Context c) {
                  int minutes = rotateMinutes(c);
                  if (minutes <= 0) return;
                  long now = System.currentTimeMillis();
                  long at = prefs(c).getLong("rotatedAt", 0L);
                  if (at == 0L) { prefs(c).edit().putLong("rotatedAt", now).apply(); return; }
                  if (now - at >= minutes * 60000L && !shuffleNow(c)) prefs(c).edit().putLong("rotatedAt", now).apply();
              }

              static JSONObject rotation(Context c) {
                  JSONObject o = new JSONObject();
                  try {
                      o.put("minutes", rotateMinutes(c));
                      o.put("at", prefs(c).getLong("rotatedAt", System.currentTimeMillis()));
                      JSONArray ex = new JSONArray();
                      for (String f : excluded(c)) ex.put(f);
                      o.put("exclude", ex);
                  } catch (Exception ignored) { }
                  return o;
              }

              // full: everything. eco: half the particles and frame rate. saver: minimal animation.
              static JSONObject power(Context c) {
                  JSONObject o = new JSONObject();
                  try {
                      BatteryManager bm = (BatteryManager) c.getSystemService(Context.BATTERY_SERVICE);
                      PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                      int level = bm != null ? bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) : 100;
                      if (level < 0 || level > 100) level = 100;
                      boolean charging = bm != null && bm.isCharging();
                      boolean saver = pm != null && pm.isPowerSaveMode();
                      String mode = charging ? "full" : (saver || level <= 20) ? "saver" : level <= 50 ? "eco" : "full";
                      o.put("mode", mode);
                      o.put("level", level);
                      o.put("charging", charging);
                      o.put("powerSave", saver);
                  } catch (Exception ignored) { }
                  return o;
              }
          }
          EOF

          cat > app/src/io/github/semesterwallpaper/WallpaperSvc.java <<'EOF'
          package io.github.semesterwallpaper;

          import android.app.Presentation;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.wallpaper.WallpaperService;
          import android.view.SurfaceHolder;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          // Live wallpaper that shows the chosen design. The page is drawn by a WebView placed on a
          // private virtual display whose output is the wallpaper surface.
          public class WallpaperSvc extends WallpaperService {
              static final String BASE_URL = "https://semester.wallpaper/";
              static final long CHECK_EVERY_MS = 30L * 60L * 1000L;
              static final long POWER_EVERY_MS = 60L * 1000L;
              static final long SHUFFLE_EVERY_MS = 30L * 1000L;
              static volatile long lastCheck = 0L;

              @Override
              public Engine onCreateEngine() {
                  return new PageEngine();
              }

              class PageEngine extends Engine {
                  final Handler main = new Handler(Looper.getMainLooper());
                  VirtualDisplay display;
                  Presentation presentation;
                  WebView web;
                  String current;
                  String power;
                  boolean shown;
                  int lastW, lastH;

                  // Reload when another design is chosen or the chosen one is updated.
                  final SharedPreferences.OnSharedPreferenceChangeListener prefsListener =
                          new SharedPreferences.OnSharedPreferenceChangeListener() {
                              @Override
                              public void onSharedPreferenceChanged(SharedPreferences sp, String key) {
                                  if ("design".equals(key) || "rev".equals(key)) reloadIfChanged();
                                  if ("design".equals(key)) refreshChosen();
                              }
                          };

                  // Battery check once a minute while visible.
                  final Runnable powerTick = new Runnable() {
                      @Override
                      public void run() {
                          updatePower();
                          if (shown) main.postDelayed(this, POWER_EVERY_MS);
                      }
                  };

                  // Shuffle check every 30 s while visible (and once when the screen goes off).
                  final Runnable shuffleTick = new Runnable() {
                      @Override
                      public void run() {
                          Store.tick(WallpaperSvc.this);
                          main.postDelayed(this, shown ? SHUFFLE_EVERY_MS : 2 * SHUFFLE_EVERY_MS);
                      }
                  };

                  @Override
                  public void onCreate(SurfaceHolder holder) {
                      super.onCreate(holder);
                      Store.prefs(WallpaperSvc.this).registerOnSharedPreferenceChangeListener(prefsListener);
                  }

                  @Override
                  public void onSurfaceChanged(SurfaceHolder holder, int format, int width, int height) {
                      super.onSurfaceChanged(holder, format, width, height);
                      if (width <= 0 || height <= 0) return;
                      if (display != null && width == lastW && height == lastH) return;
                      lastW = width;
                      lastH = height;
                      teardown();
                      try {
                          int dpi = getResources().getDisplayMetrics().densityDpi;
                          DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                          display = dm.createVirtualDisplay("semester-wallpaper", width, height, dpi,
                                  holder.getSurface(), DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY);
                          presentation = new Presentation(WallpaperSvc.this, display.getDisplay());
                          presentation.getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                          web = new WebView(presentation.getContext());
                          web.setBackgroundColor(Color.BLACK);
                          web.setVerticalScrollBarEnabled(false);
                          web.setHorizontalScrollBarEnabled(false);
                          WebSettings s = web.getSettings();
                          s.setJavaScriptEnabled(true);
                          s.setDomStorageEnabled(true);
                          web.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  power = null;
                                  updatePower();
                              }
                          });
                          presentation.setContentView(web, new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          presentation.show();
                          if (current == null) current = Store.read(WallpaperSvc.this, Store.selected(WallpaperSvc.this));
                          web.loadDataWithBaseURL(BASE_URL, current, "text/html", "utf-8", null);
                          if (!shown) web.onPause();
                      } catch (Exception e) {
                          teardown();
                      }
                      checkForUpdate();
                  }

                  @Override
                  public void onVisibilityChanged(boolean visible) {
                      super.onVisibilityChanged(visible);
                      shown = visible;
                      main.removeCallbacks(powerTick);
                      main.removeCallbacks(shuffleTick);
                      Store.tick(WallpaperSvc.this);   // a switch due now happens as the screen turns on or off
                      if (web == null) return;
                      if (visible) {
                          web.onResume();
                          reloadIfChanged();
                          main.post(powerTick);
                          checkForUpdate();
                      } else {
                          web.onPause();
                      }
                      main.postDelayed(shuffleTick, SHUFFLE_EVERY_MS);
                  }

                  void reloadIfChanged() {
                      String html = Store.read(WallpaperSvc.this, Store.selected(WallpaperSvc.this));
                      if (!html.equals(current)) show(html);
                  }

                  void show(String html) {
                      current = html;
                      if (web != null) web.loadDataWithBaseURL(BASE_URL, html, "text/html", "utf-8", null);
                  }

                  void updatePower() {
                      String p = Store.power(WallpaperSvc.this).toString();
                      if (p.equals(power)) return;
                      power = p;
                      if (web != null) {
                          web.evaluateJavascript("window.__power=" + p
                                  + ";window.dispatchEvent(new CustomEvent('wallpaper-power',{detail:window.__power}));", null);
                      }
                  }

                  void checkForUpdate() {
                      long now = System.currentTimeMillis();
                      if (now - lastCheck < CHECK_EVERY_MS) return;
                      lastCheck = now;
                      final Context ctx = WallpaperSvc.this;
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              String file = Store.selected(ctx);
                              String html = Store.download(file);
                              if (html != null) Store.save(ctx, file, html);
                          }
                      }).start();
                  }

                  // fetch the newest copy of a design that was just chosen
                  void refreshChosen() {
                      final Context ctx = WallpaperSvc.this;
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              String file = Store.selected(ctx);
                              String html = Store.download(file);
                              if (html != null) Store.save(ctx, file, html);
                          }
                      }).start();
                  }

                  @Override
                  public void onSurfaceDestroyed(SurfaceHolder holder) {
                      main.removeCallbacks(powerTick);
                      main.removeCallbacks(shuffleTick);
                      teardown();
                      lastW = 0;
                      lastH = 0;
                      super.onSurfaceDestroyed(holder);
                  }

                  @Override
                  public void onDestroy() {
                      main.removeCallbacks(powerTick);
                      main.removeCallbacks(shuffleTick);
                      Store.prefs(WallpaperSvc.this).unregisterOnSharedPreferenceChangeListener(prefsListener);
                      teardown();
                      super.onDestroy();
                  }

                  void teardown() {
                      if (presentation != null) {
                          try { presentation.dismiss(); } catch (Exception ignored) { }
                          presentation = null;
                      }
                      if (web != null) {
                          try { web.destroy(); } catch (Exception ignored) { }
                          web = null;
                      }
                      if (display != null) {
                          display.release();
                          display = null;
                      }
                  }
              }
          }
          EOF

          cat > app/src/io/github/semesterwallpaper/ChooserActivity.java <<'EOF'
          package io.github.semesterwallpaper;

          import android.app.Activity;
          import android.app.WallpaperInfo;
          import android.app.WallpaperManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONArray;
          import org.json.JSONObject;

          // The app screen: live previews of every design, a button to use one, and battery status.
          public class ChooserActivity extends Activity {
              WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  try {
                      getWindow().setStatusBarColor(Color.BLACK);
                      getWindow().setNavigationBarColor(Color.BLACK);
                  } catch (Exception ignored) { }
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(web);
                  web.loadUrl("file:///android_asset/chooser.html");
                  refresh();
              }

              @Override
              protected void onResume() {
                  super.onResume();
