<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Frontale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fit: 1;
  --top-space: 20dvh;
  --bottom-space: 19dvh;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#stage {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  box-sizing: border-box;
  padding: var(--top-space) 6vw var(--bottom-space);
  display: flex; flex-direction: column; justify-content: center;
  gap: calc(3.2dvh * var(--fit));
  transition: transform 6s linear;
}
#stage > * { flex-shrink: 0; }
#night { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #000000; opacity: 0; transition: opacity 90s linear; }
:root[data-power="saver"] *, :root[data-power="saver"] *::before, :root[data-power="saver"] *::after { animation-play-state: paused !important; }

body { background: #000000; color: #ece6dc; font-family: "Barlow", "Helvetica Neue", Arial, sans-serif; font-weight: 300; }
#stage { justify-content: flex-end; padding-left: 7vw; padding-right: 7vw; }
.cap { font-size: clamp(11.5px, 3.2vw, 13.5px); color: rgba(236, 230, 220, 0.4); letter-spacing: 0.02em; }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <p class="cap" role="img" aria-label="A headlamp beam moving over a cave wall with stalactites, dust floating in the light">Gouffre Berger, Vercors</p>
</main>

<div id="night"></div>

<script>
/* ---------- art core: animation loop, battery modes, night dimming, drift (no timetable) ---------- */
const Art = (() => {
  "use strict";
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  let power = (window.__power && window.__power.mode) || "full";
  root.dataset.power = power;
  window.addEventListener("wallpaper-power", (e) => {
    power = (e.detail && e.detail.mode) || "full";
    root.dataset.power = power;
  });
  const NIGHT_FROM = 23 * 60, NIGHT_TO = 7 * 60, NIGHT_BRIGHTNESS = 0.45;
  let night = null;
  function updateNight() {
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    const n = m >= NIGHT_FROM || m < NIGHT_TO;
    if (n !== night) {
      night = n;
      root.classList.toggle("night", n);
      $("night").style.opacity = n ? String(1 - NIGHT_BRIGHTNESS) : "0";
    }
  }
  const share = () => (power === "saver" ? 0.2 : power === "eco" ? 0.5 : 1);
  const frameSkip = () => (power === "saver" ? 4 : power === "eco" || night ? 2 : 1);
  const driftAt = (t) => [Math.sin(t / 173) * 6, Math.cos(t / 241) * 8];
  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function start(design) {
    const cvs = $("fx"), ctx = cvs.getContext("2d"), stage = $("stage");
    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      design.resize(W, H, dpr);
    }
    let last = 0, frameNo = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      frameNo++;
      if (frameNo % frameSkip()) return;
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
      last = ts;
      if (!W) return;
      const [dx, dy] = driftAt(Date.now() / 1000);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.translate(dx, dy);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      design.frame(ctx, dt, ts / 1000, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
    function drift() {
      const [dx, dy] = driftAt(Date.now() / 1000);
      if (stage) stage.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    }
    updateNight(); setInterval(updateNight, 30000);
    drift(); setInterval(drift, 6000);
    resize();
    window.addEventListener("resize", resize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(frame);
  }
  return { start, $, TAU, share, reduce, get power() { return power; }, get night() { return !!night; } };
})();

/* ---------- Frontale: darkness, and a headlamp looking around a limestone wall ---------- */
(() => {
  "use strict";
  const A = Art;
  let W = 0, H = 0, DPR = 1, rock = null, layer = null, lctx = null;
  const motes = [], sparkles = [], tips = [], drops = [];

  /* small value-noise generator for the rock */
  const perm = new Uint8Array(512);
  { const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
  const fade = (t) => t * t * (3 - 2 * t);
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const h = (i, j) => perm[(perm[(xi + i) & 255] + yi + j) & 255] / 255;
    const u = fade(xf), v = fade(yf);
    return (h(0, 0) * (1 - u) + h(1, 0) * u) * (1 - v) + (h(0, 1) * (1 - u) + h(1, 1) * u) * v;
  }
  const fbm = (x, y, o) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); a *= 0.5; f *= 2.03; } return s; };

  function makeRock() {
    // height field of craggy limestone with ledges, lit from the upper left so it has relief
    const sw = Math.ceil(W / 2), sh = Math.ceil(H / 2);
    const sc0 = 6 / sw;
    const hgt = new Float32Array(sw * sh), flow = new Float32Array(sw * sh);
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      const nx = x * sc0, ny = y * sc0;
      const base = fbm(nx * 0.45, ny * 0.45, 4);
      const ridge = 1 - Math.abs(fbm(nx * 1.25 + 7, ny * 1.25, 4) * 2 - 1);
      const q = ny * 0.75 + fbm(nx * 0.3, ny * 0.3, 3) * 3.2 + nx * 0.22;
      const f = q - Math.floor(q);
      const mask = Math.max(0, fbm(nx * 0.7 + 11, ny * 0.7, 3) - 0.42) * 3;   // bedding planes come and go
      const ledge = (f > 0.86 ? (f - 0.86) / 0.14 : 0) * Math.min(1, mask);
      const crack = Math.pow(1 - Math.abs(fbm(nx * 2.2 + 5, ny * 0.9, 3) * 2 - 1), 14);  // thin fissures
      const i = y * sw + x;
      hgt[i] = base * 0.55 + ridge * 0.42 - ledge * 0.13 - crack * 0.06 + fbm(nx * 8, ny * 8, 2) * 0.06;
      flow[i] = Math.max(0, Math.pow(fbm(nx * 3.2 + 3, ny * 0.28, 3), 2.2) * 2.4 - 0.55) * (base > 0.42 ? 1 : 0.25);
    }
    const L = [-0.48, -0.56, 0.68];
    const sw2 = sw, sh2 = sh;
    const small = document.createElement("canvas"); small.width = sw2; small.height = sh2;
    const sc = small.getContext("2d"), img = sc.createImageData(sw2, sh2);
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      const i = y * sw + x;
      const hx = hgt[y * sw + Math.min(sw - 1, x + 1)] - hgt[y * sw + Math.max(0, x - 1)];
      const hy = hgt[Math.min(sh - 1, y + 1) * sw + x] - hgt[Math.max(0, y - 1) * sw + x];
      let nx = -hx * 7, ny = -hy * 7, nz = 1;
      const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
      const diff = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
      const ao = 0.45 + 0.55 * Math.min(1, Math.max(0, hgt[i] * 1.15));
      const c = Math.min(1, flow[i]);
      const shade = (0.16 + 0.98 * diff) * ao;
      const k = i * 4;
      img.data[k] = Math.min(255, (150 + c * 70) * shade);
      img.data[k + 1] = Math.min(255, (137 + c * 68) * shade);
      img.data[k + 2] = Math.min(255, (120 + c * 62) * shade);
      img.data[k + 3] = 255;
    }
    sc.putImageData(img, 0, 0);
    rock = document.createElement("canvas"); rock.width = Math.round(W * DPR); rock.height = Math.round(H * DPR);
    const rc = rock.getContext("2d");
    rc.imageSmoothingQuality = "high";
    rc.drawImage(small, 0, 0, rock.width, rock.height);
    rc.scale(DPR, DPR);
    for (let k = 0; k < W * H / 3; k++) {
      rc.fillStyle = Math.random() < 0.5 ? "rgba(255,248,235,0.06)" : "rgba(0,0,0,0.12)";
      rc.fillRect(Math.random() * W, Math.random() * H, 1, 1);
    }
    // stalactites along the ceiling
    tips.length = 0;
    for (let x = -10; x < W + 10;) {
      const w = 6 + Math.random() * 18, len = 22 + Math.pow(Math.random(), 1.6) * H * 0.24;
      const top = -4 + Math.random() * H * 0.05;
      const g = rc.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, "#ddd0b8"); g.addColorStop(0.35, "#b4a389"); g.addColorStop(0.8, "#5e5244"); g.addColorStop(1, "#2a241e");
      rc.fillStyle = g;
      rc.beginPath();
      rc.moveTo(x, top);
      rc.quadraticCurveTo(x + w * 0.35, top + len * 0.6, x + w * 0.5, top + len);
      rc.quadraticCurveTo(x + w * 0.65, top + len * 0.6, x + w, top);
      rc.closePath(); rc.fill();
      tips.push({ x: x + w * 0.5, y: top + len });
      x += w * (0.6 + Math.random() * 1.6);
    }
    // sparkling calcite crystals
    sparkles.length = 0;
    for (let k = 0; k < 90; k++) sparkles.push({ x: Math.random() * W, y: Math.random() * H, ph: Math.random() * A.TAU, s: 0.6 + Math.random() * 1.2 });
    layer = document.createElement("canvas"); layer.width = rock.width; layer.height = rock.height;
    lctx = layer.getContext("2d");
  }

  // where the lamp is pointing: a slow wander, like someone looking around
  function beamAt(t) {
    const x = W * (0.5 + 0.24 * Math.sin(t * 0.11) + 0.1 * Math.sin(t * 0.27 + 1.3));
    const y = H * (0.45 + 0.25 * Math.sin(t * 0.083 + 0.7) + 0.07 * Math.sin(t * 0.21 + 2.1));
    const r = Math.min(W, H) * (0.62 + 0.06 * Math.sin(t * 0.13));
    return { x, y, r };
  }
  const beamAmount = (b, x, y) => { const d = Math.hypot(x - b.x, y - b.y) / b.r; return d >= 1 ? 0 : Math.pow(1 - d, 1.6); };

  const design = {
    resize(w, h, dpr) {
      W = w; H = h; DPR = dpr;
      makeRock();
      motes.length = 0;
      for (let k = 0; k < 110; k++) motes.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 4, s: 0.5 + Math.random() * 1.3, ph: Math.random() * A.TAU });
    },

    frame(ctx, dt, t) {
      if (!rock) return;
      const tt = A.reduce ? 20 : t;
      const b = beamAt(tt);
      // faint ambient so the darkness has depth
      ctx.globalAlpha = 0.05;
      ctx.drawImage(rock, 0, 0, W, H);
      ctx.globalAlpha = 1;
      // the lit part of the wall
      lctx.setTransform(1, 0, 0, 1, 0, 0);
      lctx.globalCompositeOperation = "source-over";
      lctx.clearRect(0, 0, layer.width, layer.height);
      lctx.drawImage(rock, 0, 0);
      lctx.globalCompositeOperation = "destination-in";
      lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const m = lctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      m.addColorStop(0, "rgba(0,0,0,1)"); m.addColorStop(0.3, "rgba(0,0,0,0.95)"); m.addColorStop(0.46, "rgba(0,0,0,0.62)"); m.addColorStop(0.62, "rgba(0,0,0,0.2)"); m.addColorStop(0.85, "rgba(0,0,0,0.06)"); m.addColorStop(1, "rgba(0,0,0,0)");
      lctx.fillStyle = m; lctx.fillRect(0, 0, W, H);
      ctx.drawImage(layer, 0, 0, W, H);
      // warm colour of the lamp
      ctx.globalCompositeOperation = "soft-light";
      const warm = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 0.9);
      warm.addColorStop(0, "rgba(255,200,130,0.55)"); warm.addColorStop(1, "rgba(255,200,130,0)");
      ctx.fillStyle = warm; ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
      ctx.globalCompositeOperation = "lighter";
      // crystals catching the light
      for (const s of sparkles) {
        const k = beamAmount(b, s.x, s.y);
        if (k < 0.05) continue;
        const tw = Math.max(0, Math.sin(t * 2.3 + s.ph));
        ctx.globalAlpha = k * k * tw * 0.9;
        ctx.fillStyle = "#fff6e6";
        ctx.fillRect(s.x - s.s / 2, s.y - s.s / 2, s.s, s.s);
      }
      // dust floating in the beam
      const n = Math.round(motes.length * A.share());
      for (let i = 0; i < n; i++) {
        const p = motes[i];
        p.vx += (Math.random() - 0.5) * 6 * dt; p.vy += (Math.random() - 0.5) * 6 * dt;
        p.vx *= 0.99; p.vy *= 0.99;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < 0) p.x += W; if (p.x > W) p.x -= W; if (p.y < 0) p.y += H; if (p.y > H) p.y -= H;
        const k = beamAmount(b, p.x, p.y);
        if (k < 0.02) continue;
        ctx.globalAlpha = k * (0.35 + 0.35 * Math.sin(t * 1.7 + p.ph));
        ctx.fillStyle = "#ffe9c8";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, A.TAU); ctx.fill();
      }
      // drops falling from the stalactites, seen when the light is on them
      if (!A.reduce && A.power !== "saver" && tips.length && Math.random() < dt * 0.9) {
        const tip = tips[(Math.random() * tips.length) | 0];
        drops.push({ x: tip.x, y: tip.y, v: 0 });
      }
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.v += 900 * dt; d.y += d.v * dt;
        if (d.y > H + 10) { drops.splice(i, 1); continue; }
        const k = beamAmount(b, d.x, d.y);
        ctx.globalAlpha = 0.15 + k * 0.85;
        ctx.fillStyle = "#e6f2ff";
        ctx.fillRect(d.x - 0.7, d.y, 1.4, Math.min(10, 2 + d.v * 0.012));
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    },
  };
  Art.start(design);
})();
</script>
</body>
</html>
