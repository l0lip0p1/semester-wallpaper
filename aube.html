<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1430">
<title>Aube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;1,200;1,300&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fit: 1;
  --top-space: 20dvh;
  --bottom-space: 19dvh;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#stage {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  box-sizing: border-box;
  padding: var(--top-space) 6vw var(--bottom-space);
  display: flex; flex-direction: column; justify-content: center;
  gap: calc(3.2dvh * var(--fit));
  transition: transform 6s linear;
}
#stage > * { flex-shrink: 0; }
#night { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #000000; opacity: 0; transition: opacity 90s linear; }
:root[data-power="saver"] *, :root[data-power="saver"] *::before, :root[data-power="saver"] *::after { animation-play-state: paused !important; }

body { background: #02040c; color: #fff; font-family: "Spectral", Georgia, serif; }
#stage { justify-content: flex-start; padding-top: calc(var(--top-space) + 2dvh); text-align: center; }
.word { margin: 0; font-style: italic; font-weight: 200; font-size: clamp(30px, 9vw, 40px); letter-spacing: 0.01em; color: var(--word, rgba(255,255,255,0.92)); text-shadow: 0 1px 18px rgba(0,0,0,0.18); transition: color 60s linear; }
.sun { margin: 0.35em 0 0; font-weight: 200; font-size: clamp(12.5px, 3.5vw, 14.5px); letter-spacing: 0.02em; color: var(--sub, rgba(255,255,255,0.7)); transition: color 60s linear; }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <p class="word" id="word"></p>
  <p class="sun" id="sun"></p>
</main>

<div id="night"></div>

<script>
/* ---------- art core: animation loop, battery modes, night dimming, drift (no timetable) ---------- */
const Art = (() => {
  "use strict";
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  let power = (window.__power && window.__power.mode) || "full";
  root.dataset.power = power;
  window.addEventListener("wallpaper-power", (e) => {
    power = (e.detail && e.detail.mode) || "full";
    root.dataset.power = power;
  });
  const NIGHT_FROM = 23 * 60, NIGHT_TO = 7 * 60, NIGHT_BRIGHTNESS = 0.45;
  let night = null;
  function updateNight() {
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    const n = m >= NIGHT_FROM || m < NIGHT_TO;
    if (n !== night) {
      night = n;
      root.classList.toggle("night", n);
      $("night").style.opacity = n ? String(1 - NIGHT_BRIGHTNESS) : "0";
    }
  }
  const share = () => (power === "saver" ? 0.2 : power === "eco" ? 0.5 : 1);
  const frameSkip = () => (power === "saver" ? 4 : power === "eco" || night ? 2 : 1);
  const driftAt = (t) => [Math.sin(t / 173) * 6, Math.cos(t / 241) * 8];
  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function start(design) {
    const cvs = $("fx"), ctx = cvs.getContext("2d"), stage = $("stage");
    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      design.resize(W, H, dpr);
    }
    let last = 0, frameNo = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      frameNo++;
      if (frameNo % frameSkip()) return;
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
      last = ts;
      if (!W) return;
      const [dx, dy] = driftAt(Date.now() / 1000);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.translate(dx, dy);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      design.frame(ctx, dt, ts / 1000, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
    function drift() {
      const [dx, dy] = driftAt(Date.now() / 1000);
      if (stage) stage.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    }
    updateNight(); setInterval(updateNight, 30000);
    drift(); setInterval(drift, 6000);
    resize();
    window.addEventListener("resize", resize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(frame);
  }
  return { start, $, TAU, share, reduce, get power() { return power; }, get night() { return !!night; } };
})();

/* ---------- Aube: the real sky over Lausanne, from night to dawn to dusk ---------- */
(() => {
  "use strict";
  const A = Art, $ = A.$;
  const LAT = 46.52, LON = 6.57;            // EPFL
  let W = 0, H = 0, DPR = 1, land = null, landAt = -1;
  const stars = [], birds = [], mist = [];
  let elev = 0, az = 180, rising = true, birdIn = 5;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const RAD = Math.PI / 180;

  /* sun position (accurate to a fraction of a degree, enough for colours) */
  function sun(date) {
    const d = date.getTime() / 86400000 - 10957.5;       // days since J2000
    const g = (357.529 + 0.98560028 * d) * RAD;
    const q = 280.459 + 0.98564736 * d;
    const L = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * RAD;
    const e = (23.439 - 0.00000036 * d) * RAD;
    const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
    const dec = Math.asin(Math.sin(e) * Math.sin(L));
    const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
    const ha = ((gmst * 15 + LON) * RAD - ra);
    const lat = LAT * RAD;
    const alt = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha));
    const azm = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(lat) - Math.sin(lat) * Math.cos(ha));
    return { alt: alt / RAD, az: ((azm / RAD) + 360) % 360 };
  }
  const crossCache = {};
  function crossing(date, target, up) {     // time that day when the sun crosses an altitude, to the minute
    const day = new Date(date); day.setHours(0, 0, 0, 0);
    const key = day.getTime() + (up ? "u" : "d");
    if (key in crossCache) return crossCache[key];
    let prev = sun(day).alt, found = null;
    for (let m = 5; m <= 1440 && !found; m += 5) {
      const a = sun(new Date(day.getTime() + m * 60000)).alt;
      if (up ? prev < target && a >= target : prev > target && a <= target) {
        for (let k = m - 5; k <= m; k++) {
          const b = sun(new Date(day.getTime() + k * 60000)).alt;
          if (up ? b >= target : b <= target) { found = new Date(day.getTime() + k * 60000); break; }
        }
      }
      prev = a;
    }
    return (crossCache[key] = found);
  }

  /* sky colours by sun altitude: [altitude, top, middle, horizon] */
  const KEYS = [
    [-18, [2, 4, 12], [4, 8, 22], [8, 14, 34]],
    [-10, [4, 8, 26], [14, 20, 54], [38, 36, 82]],
    [-4, [12, 20, 58], [64, 58, 112], [236, 140, 120]],
    [0, [26, 44, 96], [110, 104, 160], [255, 178, 130]],
    [5, [44, 86, 160], [140, 160, 210], [255, 214, 160]],
    [15, [58, 118, 200], [128, 178, 230], [214, 232, 246]],
    [45, [46, 112, 204], [110, 168, 232], [196, 224, 248]],
  ];
  function lerp(a, b, q) { return a.map((v, i) => v + (b[i] - v) * q); }
  function skyAt(alt) {
    if (alt <= KEYS[0][0]) return KEYS[0].slice(1);
    for (let i = 1; i < KEYS.length; i++) if (alt <= KEYS[i][0]) {
      const q = (alt - KEYS[i - 1][0]) / (KEYS[i][0] - KEYS[i - 1][0]);
      return [1, 2, 3].map((k) => lerp(KEYS[i - 1][k], KEYS[i][k], q));
    }
    return KEYS[KEYS.length - 1].slice(1);
  }
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  /* ridgelines, far to near */
  let ridges = [];
  function makeRidges() {
    ridges = [];
    for (let k = 0; k < 4; k++) {
      const base = H * (0.7 + k * 0.065), amp = H * (0.05 - k * 0.008), pts = [];
      const f1 = rnd(0.004, 0.008), f2 = rnd(0.012, 0.02), p1 = rnd(0, 6), p2 = rnd(0, 6);
      for (let x = -20; x <= W + 20; x += 4) {
        const y = base - amp * (0.6 * Math.sin(x * f1 + p1) + 0.3 * Math.sin(x * f2 + p2) + 0.1 * Math.sin(x * 0.05 + p2 * 2)) - (k === 0 ? H * 0.03 * Math.exp(-Math.pow((x - W * 0.62) / (W * 0.14), 2)) : 0);
        pts.push([x, y]);
      }
      ridges.push(pts);
    }
  }
  function drawLand(sk, night) {
    land = document.createElement("canvas"); land.width = Math.round((W + 40) * DPR); land.height = Math.round((H + 40) * DPR);
    const c = land.getContext("2d"); c.scale(DPR, DPR); c.translate(20, 20);
    ridges.forEach((pts, k) => {
      const haze = 1 - k / 3.4;
      const col = lerp([4, 6, 12], lerp(sk[2], sk[1], 0.5), 0.55 * haze * (1 - night * 0.7));
      c.fillStyle = rgb(col);
      c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
      for (const [x, y] of pts) c.lineTo(x, y);
      c.lineTo(W + 20, H + 20); c.lineTo(-20, H + 20); c.closePath(); c.fill();
    });
  }

  function words(now) {
    const up = crossing(now, -0.83, true), down = crossing(now, -0.83, false);
    const h = (d) => d ? `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` : "";
    let w;
    if (elev < -12) w = "la nuit";
    else if (elev < -0.83) w = rising ? "l'aube" : "le crépuscule";
    else if (elev < 8) w = rising ? "le lever du jour" : "le soir";
    else w = now.getHours() < 12 ? "le matin" : now.getHours() < 14 ? "midi" : "l'après-midi";
    let sub;
    if (up && now < up) sub = `Le soleil se lève à ${h(up)}`;
    else if (down && now < down) sub = `Le soleil se couche à ${h(down)}`;
    else { const t = new Date(now.getTime() + 86400000); const u = crossing(t, -0.83, true); sub = u ? `Le soleil se lève demain à ${h(u)}` : ""; }
    return [w, sub];
  }

  const design = {
    resize(w, h, dpr) {
      W = w; H = h; DPR = dpr;
      makeRidges(); landAt = -1;
      stars.length = 0;
      for (let k = 0; k < 260; k++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.72, r: 0.3 + Math.pow(Math.random(), 3) * 1.3, ph: rnd(0, 6), tw: rnd(0.5, 2) });
      mist.length = 0;
      for (let k = 0; k < 5; k++) mist.push({ x: rnd(0, W), y: H * rnd(0.72, 0.9), r: rnd(W * 0.3, W * 0.6), v: rnd(-3, 3) });
    },

    frame(ctx, dt, t) {
      const now = new Date();
      const s = sun(now); elev = s.alt; az = s.az;
      rising = sun(new Date(now.getTime() + 600000)).alt > elev;
      const sk = skyAt(elev);
      const night = Math.min(1, Math.max(0, (-elev - 4) / 10));

      // sky
      const g = ctx.createLinearGradient(0, 0, 0, H * 0.75);
      g.addColorStop(0, rgb(sk[0])); g.addColorStop(0.55, rgb(sk[1])); g.addColorStop(1, rgb(sk[2]));
      ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, H + 20);

      // stars fade in with the night
      if (night > 0.02) {
        ctx.fillStyle = "#eef2ff";
        for (const st of stars) {
          ctx.globalAlpha = night * (0.45 + 0.4 * Math.sin(t * st.tw + st.ph));
          ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, A.TAU); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // the sun: azimuth across the screen (east on the left), altitude up the sky
      const sx = W * (0.5 + (az - 180) / 150), horizon = H * 0.68;
      const sy = horizon - (elev / 40) * H * 0.42;
      if (elev > -6) {
        const glowA = Math.max(0, Math.min(1, (elev + 6) / 8));
        const gl = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.45);
        gl.addColorStop(0, `rgba(255,214,160,${0.45 * glowA})`); gl.addColorStop(0.2, `rgba(255,180,120,${0.18 * glowA})`); gl.addColorStop(1, "rgba(255,160,100,0)");
        ctx.fillStyle = gl; ctx.fillRect(-10, -10, W + 20, H + 20);
        if (elev > -1.2) {
          ctx.fillStyle = elev < 6 ? "rgba(255,226,180,0.95)" : "rgba(255,250,236,0.95)";
          ctx.beginPath(); ctx.arc(sx, sy, 11, 0, A.TAU); ctx.fill();
        }
      }

      // the land, recoloured every half minute
      if (!land || Date.now() - landAt > 30000) { drawLand(sk, night); landAt = Date.now(); }
      ctx.drawImage(land, -20, -20, W + 40, H + 40);

      // mist in the valleys
      for (const m of mist) {
        m.x += m.v * dt * A.share();
        if (m.x < -m.r) m.x = W + m.r; if (m.x > W + m.r) m.x = -m.r;
        const mg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
        mg.addColorStop(0, rgb(lerp(sk[2], [255, 255, 255], 0.3), 0.07 * (1 - night * 0.6))); mg.addColorStop(1, rgb(sk[2], 0));
        ctx.fillStyle = mg; ctx.fillRect(m.x - m.r, m.y - m.r * 0.4, m.r * 2, m.r * 0.8);
      }

      // birds cross the sky around sunrise and sunset
      if (!A.reduce && A.power !== "saver" && elev > -5 && elev < 12) {
        birdIn -= dt;
        if (birdIn <= 0) {
          birdIn = rnd(14, 30);
          const dir = Math.random() < 0.5 ? 1 : -1, y = H * rnd(0.32, 0.55), n = 3 + ((Math.random() * 5) | 0);
          for (let k = 0; k < n; k++) birds.push({ x: dir > 0 ? -20 - k * rnd(10, 18) : W + 20 + k * rnd(10, 18), y: y + k * rnd(4, 9) * (k % 2 ? 1 : -1), v: dir * rnd(22, 30), ph: rnd(0, 6), s: rnd(3, 4.5) });
        }
      }
      ctx.strokeStyle = rgb(lerp(sk[0], [0, 0, 0], 0.6), 0.8); ctx.lineWidth = 1.1; ctx.lineCap = "round";
      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.x += b.v * dt;
        if (b.x < -60 || b.x > W + 60) { birds.splice(i, 1); continue; }
        const f = Math.sin(t * 7 + b.ph) * b.s * 0.6;
        ctx.beginPath(); ctx.moveTo(b.x - b.s, b.y - f); ctx.quadraticCurveTo(b.x - b.s * 0.4, b.y - f * 0.2, b.x, b.y); ctx.quadraticCurveTo(b.x + b.s * 0.4, b.y - f * 0.2, b.x + b.s, b.y - f); ctx.stroke();
      }

      // words, coloured to stay readable on the sky
      if (!design._w || Date.now() - design._w > 1000) {
        design._w = Date.now();
        const [w, sub] = words(now);
        if ($("word").textContent !== w) $("word").textContent = w;
        if ($("sun").textContent !== sub) $("sun").textContent = sub;
        const lum = (0.3 * sk[0][0] + 0.59 * sk[0][1] + 0.11 * sk[0][2]) / 255;
        document.documentElement.style.setProperty("--word", lum > 0.45 ? "rgba(20,30,60,0.85)" : "rgba(255,255,255,0.92)");
        document.documentElement.style.setProperty("--sub", lum > 0.45 ? "rgba(20,30,60,0.6)" : "rgba(255,255,255,0.68)");
      }
    },
  };
  Art.start(design);
})();
</script>
</body>
</html>
