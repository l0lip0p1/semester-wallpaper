<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400&family=Barlow+Condensed:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fit: 1;
  --top-space: 20dvh;
  --bottom-space: 19dvh;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#stage {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  box-sizing: border-box;
  padding: var(--top-space) 6vw var(--bottom-space);
  display: flex; flex-direction: column; justify-content: center;
  gap: calc(3.2dvh * var(--fit));
  transition: transform 6s linear;
}
#stage > * { flex-shrink: 0; }
#night { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #000000; opacity: 0; transition: opacity 90s linear; }
:root[data-power="saver"] *, :root[data-power="saver"] *::before, :root[data-power="saver"] *::after { animation-play-state: paused !important; }

body { background: #000000; color: #ece6dc; font-family: "Barlow", "Helvetica Neue", Arial, sans-serif; font-weight: 300; }
#stage { justify-content: flex-start; padding-left: 7vw; padding-right: 7vw; }
.cap h1 { margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 500; font-size: clamp(16px, 4.6vw, 19px); color: rgba(244, 239, 230, 0.85); }
.cap p { margin: 0.15em 0 0; font-size: clamp(11.5px, 3.2vw, 13.5px); color: rgba(236, 230, 220, 0.45); }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <div class="cap" role="img" aria-label="Rimstone pools under hanging stalactites, drops falling into still water">
    <h1>Salle des Treize</h1>
    <p>Gouffre Berger, −500 m</p>
  </div>
</main>

<div id="night"></div>

<script>
/* ---------- art core: animation loop, battery modes, night dimming, drift (no timetable) ---------- */
const Art = (() => {
  "use strict";
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  let power = (window.__power && window.__power.mode) || "full";
  root.dataset.power = power;
  window.addEventListener("wallpaper-power", (e) => {
    power = (e.detail && e.detail.mode) || "full";
    root.dataset.power = power;
  });
  const NIGHT_FROM = 23 * 60, NIGHT_TO = 7 * 60, NIGHT_BRIGHTNESS = 0.45;
  let night = null;
  function updateNight() {
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    const n = m >= NIGHT_FROM || m < NIGHT_TO;
    if (n !== night) {
      night = n;
      root.classList.toggle("night", n);
      $("night").style.opacity = n ? String(1 - NIGHT_BRIGHTNESS) : "0";
    }
  }
  const share = () => (power === "saver" ? 0.2 : power === "eco" ? 0.5 : 1);
  const frameSkip = () => (power === "saver" ? 4 : power === "eco" || night ? 2 : 1);
  const driftAt = (t) => [Math.sin(t / 173) * 6, Math.cos(t / 241) * 8];
  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function start(design) {
    const cvs = $("fx"), ctx = cvs.getContext("2d"), stage = $("stage");
    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      design.resize(W, H, dpr);
    }
    let last = 0, frameNo = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      frameNo++;
      if (frameNo % frameSkip()) return;
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
      last = ts;
      if (!W) return;
      const [dx, dy] = driftAt(Date.now() / 1000);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.translate(dx, dy);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      design.frame(ctx, dt, ts / 1000, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
    function drift() {
      const [dx, dy] = driftAt(Date.now() / 1000);
      if (stage) stage.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    }
    updateNight(); setInterval(updateNight, 30000);
    drift(); setInterval(drift, 6000);
    resize();
    window.addEventListener("resize", resize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(frame);
  }
  return { start, $, TAU, share, reduce, get power() { return power; }, get night() { return !!night; } };
})();

/* ---------- Gours: rimstone pools under the stalactites, drops falling into still water ---------- */
(() => {
  "use strict";
  const A = Art;
  let W = 0, H = 0, DPR = 1, layer = null;
  let pools = [], tips = [], drops = [], ripples = [], splashes = [], mist = [], glints = [];
  const LAMP = { x: 0.84, y: 0.6 };
  const rnd = (a, b) => a + Math.random() * (b - a);

  function lampLight(x, y) {                 // 0..1, how much the lamp reaches a point
    const d = Math.hypot(x - LAMP.x * W, (y - LAMP.y * H) * 0.8) / (H * 0.62);
    return Math.max(0, 1 - d);
  }

  function build() {
    layer = document.createElement("canvas");
    layer.width = Math.round(W * DPR); layer.height = Math.round(H * DPR);
    const c = layer.getContext("2d");
    c.scale(DPR, DPR);
    // the chamber: dark, warmer towards the lamp
    const bg = c.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#040302"); bg.addColorStop(0.45, "#0c0907"); bg.addColorStop(0.75, "#0f0b08"); bg.addColorStop(1, "#030202");
    c.fillStyle = bg; c.fillRect(0, 0, W, H);
    const glow = c.createRadialGradient(LAMP.x * W, LAMP.y * H, 0, LAMP.x * W, LAMP.y * H, H * 0.62);
    glow.addColorStop(0, "rgba(255,168,92,0.30)"); glow.addColorStop(0.35, "rgba(200,120,60,0.12)"); glow.addColorStop(1, "rgba(120,70,30,0)");
    c.fillStyle = glow; c.fillRect(0, 0, W, H);
    // soft shapes of the far wall
    for (let k = 0; k < 14; k++) {
      const x = rnd(0, W), y = rnd(H * 0.2, H * 0.62), r = rnd(40, 140);
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      const l = lampLight(x, y);
      g.addColorStop(0, `rgba(${120 + l * 80},${95 + l * 55},${70 + l * 35},${0.05 + l * 0.08})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
    }

    // stalactites: lit on the side facing the lamp
    tips = [];
    for (let x = -8; x < W + 8;) {
      const w = rnd(5, 20), len = 16 + Math.pow(Math.random(), 1.7) * H * (0.16 + 0.14 * Math.sin(Math.PI * x / W));
      const top = rnd(-6, H * 0.03);
      const l = lampLight(x, top + len * 0.6);
      const g = c.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, `rgb(${18 + l * 30},${14 + l * 22},${11 + l * 15})`);
      g.addColorStop(0.6, `rgb(${60 + l * 120},${48 + l * 92},${36 + l * 60})`);
      g.addColorStop(1, `rgb(${90 + l * 150},${72 + l * 115},${52 + l * 75})`);
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(x, top);
      c.bezierCurveTo(x + w * 0.2, top + len * 0.55, x + w * 0.42, top + len * 0.85, x + w * 0.5, top + len);
      c.bezierCurveTo(x + w * 0.58, top + len * 0.85, x + w * 0.8, top + len * 0.55, x + w, top);
      c.closePath(); c.fill();
      tips.push({ x: x + w * 0.5, y: top + len, l });
      x += w * rnd(0.9, 2.8);
    }

    // rimstone pools, from the back (high, small) to the front (low, wide)
    pools = [];
    const N = 5;
    for (let k = 0; k < N; k++) {
      const f = k / (N - 1);
      const y = H * (0.6 + 0.07 * k);
      const a = W * (0.14 - 0.42 * f) + rnd(-8, 8), b = W * (0.97 + 0.26 * f) + rnd(-8, 8);
      const bulge = H * (0.012 + 0.02 * f), faceH = H * (0.018 + 0.016 * f), depth = H * (0.03 + 0.014 * f);
      const lobes = 2 + Math.floor(Math.random() * 3), lobeAmp = H * 0.006 * (1 + f), phase = Math.random() * 6;
      const rim = [];
      for (let i = 0; i <= 48; i++) {
        const u = i / 48;
        rim.push([a + (b - a) * u, y + bulge * Math.sin(Math.PI * u) + lobeAmp * Math.sin(u * Math.PI * lobes * 2 + phase) * Math.sin(Math.PI * u)]);
      }
      const water = new Path2D();
      water.moveTo(a, y - depth * 0.35);
      water.bezierCurveTo(a + (b - a) * 0.3, y - depth * 1.05, a + (b - a) * 0.7, y - depth * 1.05, b, y - depth * 0.35);
      for (let i = rim.length - 1; i >= 0; i--) water.lineTo(rim[i][0], rim[i][1]);
      water.closePath();
      pools.push({ y, a, b, depth, rim, faceH, water, f });
    }
    // rock floor of the chamber
    const fl = c.createLinearGradient(0, H * 0.55, 0, H);
    fl.addColorStop(0, "#1c140e"); fl.addColorStop(0.5, "#120c08"); fl.addColorStop(1, "#040302");
    c.fillStyle = fl;
    c.beginPath(); c.moveTo(0, H * 0.6);
    for (let x = 0; x <= W; x += W / 12) c.lineTo(x, H * (0.585 + 0.012 * Math.sin(x * 0.04)));
    c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
    // stalagmites and a column standing at the back of the chamber
    const mite = (x, h, w, base) => {
      const l = lampLight(x, base - h / 2);
      const g = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
      g.addColorStop(0, `rgb(${20 + l * 25},${15 + l * 18},${11 + l * 12})`);
      g.addColorStop(0.65, `rgb(${70 + l * 120},${55 + l * 90},${40 + l * 60})`);
      g.addColorStop(1, `rgb(${95 + l * 140},${75 + l * 105},${55 + l * 70})`);
      c.fillStyle = g;
      c.beginPath(); c.moveTo(x - w / 2, base);
      c.bezierCurveTo(x - w * 0.42, base - h * 0.5, x - w * 0.12, base - h * 0.92, x, base - h);
      c.bezierCurveTo(x + w * 0.12, base - h * 0.92, x + w * 0.42, base - h * 0.5, x + w / 2, base);
      c.closePath(); c.fill();
    };
    mite(W * 0.12, H * 0.2, 30, H * 0.6); mite(W * 0.22, H * 0.11, 18, H * 0.6); mite(W * 0.05, H * 0.08, 14, H * 0.61);
    {
      const x = W * 0.64, w = 22, l = lampLight(x, H * 0.4);
      const g = c.createLinearGradient(x - w, 0, x + w, 0);
      g.addColorStop(0, `rgb(${22 + l * 30},${17 + l * 22},${12 + l * 15})`);
      g.addColorStop(0.7, `rgb(${80 + l * 120},${62 + l * 92},${44 + l * 62})`);
      g.addColorStop(1, `rgb(${105 + l * 140},${82 + l * 105},${58 + l * 72})`);
      c.fillStyle = g;
      c.beginPath(); c.moveTo(x - w * 0.5, 0);
      c.bezierCurveTo(x - w * 0.2, H * 0.25, x - w * 0.2, H * 0.4, x - w, H * 0.6);
      c.lineTo(x + w, H * 0.6);
      c.bezierCurveTo(x + w * 0.2, H * 0.4, x + w * 0.2, H * 0.25, x + w * 0.5, 0);
      c.closePath(); c.fill();
    }
    for (let k = pools.length - 1; k >= 0; k--) {
      const p = pools[k];
      // the water
      const l = lampLight((p.a + p.b) / 2, p.y);
      const wg = c.createLinearGradient(0, p.y - p.depth, 0, p.y + p.faceH);
      wg.addColorStop(0, `rgb(${6 + l * 10},${30 + l * 30},${34 + l * 32})`);
      wg.addColorStop(1, `rgb(${14 + l * 20},${60 + l * 50},${66 + l * 48})`);
      c.fillStyle = wg; c.fill(p.water);
      // the lamp reflected on the surface
      c.save(); c.clip(p.water);
      const rx = LAMP.x * W, rg = c.createRadialGradient(rx, p.y - p.depth * 0.3, 0, rx, p.y - p.depth * 0.3, W * 0.35);
      rg.addColorStop(0, "rgba(255,190,120,0.35)"); rg.addColorStop(1, "rgba(255,190,120,0)");
      c.fillStyle = rg; c.fillRect(0, p.y - p.depth * 1.2, W, p.depth * 1.6);
      c.restore();
      // the calcite face below the rim
      c.beginPath();
      p.rim.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
      for (let i = p.rim.length - 1; i >= 0; i--) c.lineTo(p.rim[i][0], p.rim[i][1] + p.faceH * (0.75 + 0.25 * Math.sin(i * 0.9)));
      c.closePath();
      const fg = c.createLinearGradient(0, p.y, 0, p.y + p.faceH * 1.6);
      fg.addColorStop(0, `rgba(${170 + l * 70},${140 + l * 60},${105 + l * 45},1)`);
      fg.addColorStop(1, "rgba(25,18,12,1)");
      c.fillStyle = fg; c.fill();
      c.save(); c.clip();
      c.strokeStyle = "rgba(0,0,0,0.18)"; c.lineWidth = 1;
      for (let x = p.a; x < p.b; x += rnd(3, 8)) { c.beginPath(); c.moveTo(x, p.y - 4); c.lineTo(x + rnd(-1, 1), p.y + p.faceH * 2); c.stroke(); }
      c.restore();
      // the rim's lit edge
      c.beginPath();
      p.rim.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
      const eg = c.createLinearGradient(p.a, 0, p.b, 0);
      eg.addColorStop(0, "rgba(233,220,195,0.25)"); eg.addColorStop(0.75, `rgba(250,236,210,${0.6 + l * 0.4})`); eg.addColorStop(1, "rgba(233,220,195,0.5)");
      c.strokeStyle = eg; c.lineWidth = 1.5; c.stroke();
      // rock banks hide the ends of the pool, so it sits in the floor
      for (const [ex, side] of [[p.a, -1], [p.b, 1]]) {
        if (ex < -20 || ex > W + 20) continue;
        const bw = W * 0.12, by = p.y + p.faceH * 0.4;
        const bg2 = c.createRadialGradient(ex, by, 0, ex, by, bw);
        bg2.addColorStop(0, "rgba(22,15,10,1)"); bg2.addColorStop(0.55, "rgba(22,15,10,0.9)"); bg2.addColorStop(1, "rgba(22,15,10,0)");
        c.fillStyle = bg2;
        c.beginPath(); c.ellipse(ex + side * bw * 0.25, by, bw, p.depth + p.faceH * 1.4, 0, 0, A.TAU); c.fill();
      }
    }
    // shadow in the foreground
    const floor = c.createLinearGradient(0, H * 0.88, 0, H);
    floor.addColorStop(0, "rgba(0,0,0,0)"); floor.addColorStop(1, "rgba(0,0,0,0.85)");
    c.fillStyle = floor; c.fillRect(0, H * 0.86, W, H * 0.14);

    // drops come only from tips that hang above a pool
    tips = tips.filter((t) => pools.some((p) => t.x > p.a + 6 && t.x < p.b - 6) && t.y < H * 0.45)
      .sort(() => Math.random() - 0.5).slice(0, 5);
    tips.forEach((t) => { t.grow = rnd(0, 1); t.rate = rnd(0.12, 0.3); });
    glints = [];
    for (const p of pools) for (let k = 0; k < 6; k++) glints.push({ p, x: rnd(p.a, p.b), y: p.y - rnd(0.15, 0.85) * p.depth, w: rnd(6, 22), ph: rnd(0, 6), sp: rnd(2, 6) });
    mist = [];
    for (let k = 0; k < 4; k++) mist.push({ x: rnd(0, W), y: rnd(H * 0.52, H * 0.75), r: rnd(W * 0.25, W * 0.45), v: rnd(-4, 4) });
  }

  function poolUnder(x) {
    const cands = pools.filter((p) => x > p.a + 4 && x < p.b - 4);
    return cands.length ? cands[(Math.random() * cands.length) | 0] : null;
  }

  const design = {
    resize(w, h, dpr) { W = w; H = h; DPR = dpr; build(); },

    frame(ctx, dt, t) {
      if (!layer) return;
      ctx.drawImage(layer, 0, 0, W, H);
      const live = A.power !== "saver" && !A.reduce;

      // slow glints on the water
      for (const g of glints) {
        ctx.save(); ctx.clip(g.p.water);
        const q = 0.5 + 0.5 * Math.sin(t * 0.6 + g.ph);
        ctx.globalAlpha = 0.12 + 0.18 * q * lampLight(g.x, g.y);
        ctx.fillStyle = "#ffe2bd";
        ctx.fillRect(g.x + Math.sin(t * 0.2 + g.ph) * g.sp - g.w / 2, g.y, g.w, 0.8);
        ctx.restore();
      }
      ctx.globalAlpha = 1;

      // drops: a bead grows at the tip, falls, and rings the pool below
      for (const tip of tips) {
        if (live) tip.grow += dt * tip.rate;
        const r = Math.min(1, tip.grow) * 2.1;
        ctx.globalAlpha = 0.5 + 0.5 * tip.l;
        ctx.fillStyle = "#dff3f5";
        ctx.beginPath(); ctx.ellipse(tip.x, tip.y + r * 0.8, r * 0.75, r, 0, 0, A.TAU); ctx.fill();
        if (tip.grow >= 1.25 && live) {
          const p = poolUnder(tip.x);
          if (p) drops.push({ x: tip.x, y: tip.y + 2, v: 0, p, target: p.y - p.depth * rnd(0.2, 0.7) });
          tip.grow = 0; tip.rate = rnd(0.12, 0.3);
        }
      }
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.v += 1100 * dt; d.y += d.v * dt;
        if (d.y >= d.target) {
          ripples.push({ x: d.x, y: d.target, p: d.p, t: 0 });
          for (let k = 0; k < 3; k++) splashes.push({ x: d.x, y: d.target, vx: rnd(-25, 25), vy: rnd(-70, -35), t: 0 });
          drops.splice(i, 1); continue;
        }
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = "#e8f6f7";
        ctx.beginPath(); ctx.ellipse(d.x, d.y, 1, Math.min(5, 1.6 + d.v * 0.006), 0, 0, A.TAU); ctx.fill();
      }
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.t += dt;
        if (r.t > 2.8) { ripples.splice(i, 1); continue; }
        ctx.save(); ctx.clip(r.p.water);
        ctx.strokeStyle = "#f2fbfb"; ctx.lineWidth = 0.9;
        for (let k = 0; k < 3; k++) {
          const tt = r.t - k * 0.32;
          if (tt <= 0) continue;
          const rx = tt * 26;
          ctx.globalAlpha = Math.max(0, 0.55 * (1 - tt / 2.4));
          ctx.beginPath(); ctx.ellipse(r.x, r.y, rx, rx * 0.26, 0, 0, A.TAU); ctx.stroke();
        }
        ctx.restore();
      }
      for (let i = splashes.length - 1; i >= 0; i--) {
        const s = splashes[i];
        s.t += dt; s.vy += 500 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.t > 0.3) { splashes.splice(i, 1); continue; }
        ctx.globalAlpha = 0.7 * (1 - s.t / 0.3);
        ctx.fillStyle = "#eaf7f8"; ctx.fillRect(s.x, s.y, 1, 1);
      }

      // mist drifting over the pools
      for (const m of mist) {
        m.x += m.v * dt * A.share();
        if (m.x < -m.r) m.x = W + m.r; if (m.x > W + m.r) m.x = -m.r;
        const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
        g.addColorStop(0, "rgba(210,190,165,0.07)"); g.addColorStop(1, "rgba(210,190,165,0)");
        ctx.globalAlpha = 1; ctx.fillStyle = g;
        ctx.fillRect(m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
      }

      // the lamp breathes a little
      ctx.globalCompositeOperation = "lighter";
      const f = 0.5 + 0.5 * Math.sin(t * 1.3) * Math.sin(t * 0.37);
      const g = ctx.createRadialGradient(LAMP.x * W, LAMP.y * H, 0, LAMP.x * W, LAMP.y * H, H * 0.4);
      g.addColorStop(0, `rgba(255,170,90,${0.03 + 0.03 * f})`); g.addColorStop(1, "rgba(255,170,90,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    },
  };
  Art.start(design);
})();
</script>
</body>
</html>
