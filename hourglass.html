<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hourglass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fit: 1;
  --top-space: 20dvh;
  --bottom-space: 19dvh;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#stage {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  box-sizing: border-box;
  padding: var(--top-space) 6vw var(--bottom-space);
  display: flex; flex-direction: column; justify-content: center;
  gap: calc(3.2dvh * var(--fit));
  transition: transform 6s linear;
}
#stage > * { flex-shrink: 0; }
#night { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #000000; opacity: 0; transition: opacity 90s linear; }
:root[data-power="saver"] *, :root[data-power="saver"] *::before, :root[data-power="saver"] *::after { animation-play-state: paused !important; }

:root {
  --ink: #f3ebe0;
  --ink-2: rgba(243, 235, 224, 0.62);
  --ink-3: rgba(243, 235, 224, 0.38);
  --gold: #e9c58c;
}
body {
  background: #000000;
  color: var(--ink);
  font-family: "Cormorant Garamond", "Iowan Old Style", Garamond, Georgia, serif;
  font-weight: 300;
  font-variant-numeric: lining-nums;
}
#stage { gap: calc(3.4dvh * var(--fit)); }
.glass { width: calc(min(50vw, 25dvh, 260px) * var(--fit)); aspect-ratio: 5 / 8; margin: 0 auto; }
.read { text-align: center; line-height: 1; }
.days { font-size: calc(min(17vw, 8.4dvh, 88px) * var(--fit)); font-weight: 300; letter-spacing: -0.01em; }
.days em { font-size: 0.42em; font-style: italic; font-weight: 300; color: var(--ink-2); margin-left: 0.12em; letter-spacing: 0; }
.clock { margin-top: 0.35em; font-size: clamp(17px, 4.8vw, 21px); font-style: italic; color: var(--ink); }
.pct { margin-top: 0.55em; font-size: clamp(13px, 3.6vw, 15.5px); color: var(--ink-3); }
.pct .digits { color: var(--ink-2); }
.digits { white-space: pre; }
.digits span { display: inline-block; width: 0.52em; text-align: center; }
.digits span.pt { width: 0.24em; }
.digits span.tx { display: inline; width: auto; }
.status { margin: 0; text-align: center; font-size: clamp(13px, 3.6vw, 15.5px); font-style: italic; color: var(--ink-2); }
.status b { font-style: normal; font-weight: 400; color: var(--gold); }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <div class="glass" id="glass" role="img" aria-label="An hourglass: the sand that has fallen is the time already gone until the exam session"></div>

  <div class="read">
    <div class="days"><span id="dN"></span><em id="dU">days</em></div>
    <div class="clock digits" id="dT"></div>
    <div class="pct" id="dPline"><span class="digits" id="dP"></span> % of the way to the exam session</div>
  </div>

  <p class="status" id="status"></p>
</main>

<div id="night"></div>

<script>
/* =====================================================================
   EDIT HERE: dates, timetable, exams, night mode
   Dates: "YYYY-MM-DD" or "YYYY-MM-DDTHH:MM" (local time)
   ===================================================================== */
const CONFIG = {
  countFrom: "2026-09-07T00:00",          // 0% point of every countdown
  examSessionStart: "2027-01-11T00:00",   // the main ring reaches 100% here

  firstClassDay: "2026-09-07",
  lastClassDay: "2026-12-18",
  noClassDays: ["2026-09-21"],                    // Jeune federal
  noClassRanges: [["2026-10-19", "2026-10-23"]],  // autumn break

  courses: {
    AN:   { name: "Analysis I",                  color: "#8ecbff" },
    AL:   { name: "Linear Algebra",              color: "#ff9ec7" },
    AICC: { name: "AICC I",                      color: "#b8f28a" },
    PHYS: { name: "General physics: mechanics",  color: "#ffc27a" },
    PROG: { name: "Introduction to programming", color: "#c3a6ff" },
  },

  timetable: [
    { day: "Mon", start: "10:15", end: "12:00", course: "AN",   type: "Lecture" },
    { day: "Tue", start: "08:15", end: "10:00", course: "AICC", type: "Lecture" },
    { day: "Tue", start: "10:15", end: "12:00", course: "PHYS", type: "Exercise" },
    { day: "Tue", start: "15:15", end: "17:00", course: "AL",   type: "Lecture" },
    { day: "Wed", start: "10:15", end: "12:00", course: "AN",   type: "Lecture" },
    { day: "Wed", start: "13:15", end: "14:00", course: "PROG", type: "Lecture" },
    { day: "Wed", start: "14:15", end: "15:00", course: "PROG", type: "Lecture" },
    { day: "Wed", start: "15:15", end: "17:00", course: "AICC", type: "Lecture" },
    { day: "Wed", start: "17:15", end: "19:00", course: "PHYS", type: "Lecture" },
    { day: "Thu", start: "08:15", end: "10:00", course: "AL",   type: "Lecture" },
    { day: "Thu", start: "10:15", end: "12:00", course: "AN",   type: "Exercise" },
    { day: "Thu", start: "12:15", end: "14:00", course: "PHYS", type: "Lecture" },
    { day: "Fri", start: "08:15", end: "10:00", course: "AL",   type: "Exercise" },
    { day: "Fri", start: "10:15", end: "12:00", course: "AICC", type: "Exercise" },
    { day: "Fri", start: "13:15", end: "15:00", course: "PROG", type: "Exercise" },
    { day: "Fri", start: "15:15", end: "16:00", course: "PROG", type: "Lab" },
  ],

  // date: null means "date not known yet"
  exams: [
    { label: "PROG", course: "PROG", date: "2026-12-12T09:00" },                      // exam 09:00-12:00
    { label: "PROJ", course: "PROG", date: "2026-12-17T13:00", kind: "deadline" },    // project submission
    { label: "DEF",  course: "PROG", date: "2026-12-18T08:00", kind: "deadline" },    // project defense (time TBD)
    { label: "PHYS", course: "PHYS", date: "2027-01-15T08:00" },                      // exam 08:00-11:30
    { label: "AN",   course: "AN",   date: null },
    { label: "AL",   course: "AL",   date: null },
    { label: "AICC", course: "AICC", date: null },
  ],
  tbdText: "in January",

  nightDim: { from: "23:00", to: "07:00", brightness: 0.45 },
  decimals: { big: 6, live: 6, small: 2, exams: 5 },  // live = the course you are in right now
  particles: 60,

  // free space left for the lock screen clock (top) and charging text / shortcuts (bottom)
  layout: { topSpace: "20dvh", bottomSpace: "19dvh" },
};
/* ===================================================================== */

/* ---------- core: schedule, timing, battery, night and layout (same in every design) ---------- */
const Core = (() => {
  "use strict";
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const pad = (n) => String(n).padStart(2, "0");
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const DAYNUM = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  const SDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const SMONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  root.style.setProperty("--top-space", CONFIG.layout.topSpace);
  root.style.setProperty("--bottom-space", CONFIG.layout.bottomSpace);

  function toTime(s) {
    const [d, t] = s.split("T");
    const [y, m, dd] = d.split("-").map(Number);
    const [hh, mm] = (t || "00:00").split(":").map(Number);
    return new Date(y, m - 1, dd, hh, mm, 0, 0).getTime();
  }
  const ymd = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
  const hm = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const shortDate = (t) => { const d = new Date(t); return `${d.getDate()} ${SMONTHS[d.getMonth()]}`; };

  /* schedule */
  const START = toTime(CONFIG.countFrom);
  const SESSION = toTime(CONFIG.examSessionStart);
  const off = new Set(CONFIG.noClassDays);
  for (const [a, b] of CONFIG.noClassRanges) {
    const d = new Date(toTime(a)); const end = toTime(b);
    while (d.getTime() <= end) { off.add(ymd(d)); d.setDate(d.getDate() + 1); }
  }
  const sessions = [];
  {
    const d = new Date(toTime(CONFIG.firstClassDay));
    const last = toTime(CONFIG.lastClassDay);
    while (d.getTime() <= last) {
      if (!off.has(ymd(d))) {
        for (const s of CONFIG.timetable) {
          if (DAYNUM[s.day] !== d.getDay()) continue;
          const [sh, sm] = s.start.split(":").map(Number);
          const [eh, em] = s.end.split(":").map(Number);
          sessions.push({
            course: s.course, type: s.type,
            start: new Date(d.getFullYear(), d.getMonth(), d.getDate(), sh, sm).getTime(),
            end: new Date(d.getFullYear(), d.getMonth(), d.getDate(), eh, em).getTime(),
          });
        }
      }
      d.setDate(d.getDate() + 1);
    }
  }
  sessions.sort((a, b) => a.start - b.start);
  const totals = {};
  for (const s of sessions) totals[s.course] = (totals[s.course] || 0) + (s.end - s.start);
  function courseProgress(code, now) {
    let done = 0;
    for (const s of sessions) {
      if (s.course !== code) continue;
      if (now >= s.end) done += s.end - s.start;
      else if (now > s.start) done += now - s.start;
    }
    return totals[code] ? done / totals[code] : 0;
  }

  /* exams */
  const examList = CONFIG.exams
    .map((x, idx) => ({ ...x, idx, t: x.date ? toTime(x.date) : null }))
    .sort((a, b) => (a.t === null || b.t === null) ? (a.t === null) - (b.t === null) || a.idx - b.idx : a.t - b.t);
  const dated = examList.filter((x) => x.t !== null);
  const tbd = examList.filter((x) => x.t === null).map((x) => x.label);
  const tbdText = !tbd.length ? "" :
    `${tbd.length > 1 ? `${tbd.slice(0, -1).join(", ")} and ${tbd[tbd.length - 1]}` : tbd[0]} ${tbd.length > 1 ? "exams: dates" : "exam: date"} ${CONFIG.tbdText}`;

  /* status line */
  function whenLabel(t, now) {
    const d = new Date(t), n = new Date(now);
    const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
    if (diff === 0) return `today ${hm(t)}`;
    if (diff === 1) return `tomorrow ${hm(t)}`;
    if (diff < 7) return `${SDAYS[d.getDay()]} ${hm(t)}`;
    return `${SDAYS[d.getDay()]} ${shortDate(t)}, ${hm(t)}`;
  }
  function status(now, live) {
    if (live) return { live: true, code: live.course, text: `${live.course} ${live.type.toLowerCase()} until ${hm(live.end)}` };
    const next = sessions.find((s) => s.start > now);
    if (next) return { live: false, code: next.course, text: `Next: ${next.course} ${next.type.toLowerCase()}, ${whenLabel(next.start, now)}` };
    if (now < SESSION) return { live: false, code: null, text: `Classes are over. Exams start ${shortDate(SESSION)}.` };
    return { live: false, code: null, text: "Exam session. Good luck." };
  }

  /* one snapshot of everything a design shows */
  function state(now) {
    const live = sessions.find((s) => now >= s.start && now < s.end) || null;
    const courses = Object.keys(CONFIG.courses).map((code) => ({
      code, name: CONFIG.courses[code].name, color: CONFIG.courses[code].color,
      p: courseProgress(code, now), live: !!live && live.course === code,
    }));
    return {
      now, live,
      session: clamp01((now - START) / (SESSION - START)),
      sessionLeft: SESSION - now,
      courses,
      all: courses.reduce((a, c) => a + c.p, 0) / courses.length,
      exams: dated.map((x) => ({
        label: x.label, course: x.course, kind: x.kind || "exam", t: x.t,
        p: clamp01((now - START) / (x.t - START)), left: x.t - now, done: now >= x.t,
      })),
      status: status(now, live),
    };
  }

  /* number helpers */
  function pct(p, dec) {
    if (p >= 1) return ["100", ""];
    const v = (clamp01(p) * 100).toFixed(dec);
    const k = v.indexOf(".");
    return k < 0 ? [v, ""] : [v.slice(0, k), v.slice(k)];
  }
  function parts(ms) {
    let s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    return { d, h, m: Math.floor(s / 60), s: s % 60 };
  }
  function short(ms) {
    const { d, h, m } = parts(ms);
    if (d > 0) return `${d} d ${h} h`;
    if (h > 0) return `${h} h ${pad(m)} m`;
    return `${m} m`;
  }
  const setText = (el, t) => { if (el && el.textContent !== t) el.textContent = t; };
  // fixed-width digits, so ticking numbers never wobble whatever the font
  function setDigits(el, str) {
    if (!el || el._s === str) return;
    el._s = str;
    while (el.children.length < str.length) el.appendChild(document.createElement("span"));
    while (el.children.length > str.length) el.lastChild.remove();
    for (let i = 0; i < str.length; i++) {
      const c = el.children[i];
      if (c.textContent !== str[i]) { c.textContent = str[i]; c.className = /[0-9]/.test(str[i]) ? "" : str[i] === "." ? "pt" : "tx"; }
    }
  }
  function ring(svgParent, r, cls) {
    const ns = "http://www.w3.org/2000/svg";
    const C = TAU * r;
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", "60"); c.setAttribute("cy", "60"); c.setAttribute("r", String(r));
    c.setAttribute("class", cls);
    if (cls.includes("prog")) { c.setAttribute("stroke-dasharray", `${C} ${C}`); c.setAttribute("stroke-dashoffset", String(C)); }
    svgParent.appendChild(c);
    return { el: c, C, last: -1 };
  }
  function setArc(a, p) {
    if (Math.abs(p - a.last) < 0.0006 && !(p >= 1 && a.last < 1)) return;
    a.last = p;
    a.el.setAttribute("stroke-dashoffset", (a.C * (1 - p)).toFixed(3));
    a.el.style.visibility = p <= 0 ? "hidden" : "visible";
  }

  /* battery mode from the app: full, eco or saver */
  let power = (window.__power && window.__power.mode) || "full";
  root.dataset.power = power;
  window.addEventListener("wallpaper-power", (e) => {
    power = (e.detail && e.detail.mode) || "full";
    root.dataset.power = power;
  });
  const share = () => (power === "saver" ? 0.2 : power === "eco" ? 0.5 : 1);

  /* night */
  let night = null;
  const minutesOf = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  function updateNight(d) {
    const m = d.getHours() * 60 + d.getMinutes();
    const f = minutesOf(CONFIG.nightDim.from), t = minutesOf(CONFIG.nightDim.to);
    const n = f > t ? (m >= f || m < t) : (m >= f && m < t);
    if (n !== night) {
      night = n;
      root.classList.toggle("night", n);
      $("night").style.opacity = n ? String(1 - CONFIG.nightDim.brightness) : "0";
    }
  }
  const frameSkip = () => (power === "saver" ? 4 : power === "eco" || night ? 2 : 1);
  const tickMs = () => (power === "saver" ? 500 : night ? 400 : power === "eco" ? 120 : 60);

  /* slow drift against screen burn-in */
  const driftAt = (t) => [Math.sin(t / 173) * 7, Math.cos(t / 241) * 9];

  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function start(design) {
    const stage = $("stage");
    const cvs = $("fx");
    const ctx = cvs.getContext("2d");
    let W = 0, H = 0;

    function fit() {
      const cs = getComputedStyle(stage);
      const kids = [...stage.children];
      const used = () => kids.reduce((h, k) => h + k.offsetHeight, 0) + parseFloat(cs.rowGap || 0) * (kids.length - 1);
      const avail = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      let f = 1;
      root.style.setProperty("--fit", "1");
      while (f > 0.6 && used() > avail) { f -= 0.03; root.style.setProperty("--fit", f.toFixed(2)); }
    }
    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fit();
      if (design.resize) design.resize(W, H);
      if (design.measure) design.measure();
    }
    function drift() {
      const [dx, dy] = driftAt(Date.now() / 1000);
      stage.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    }

    design.setup(state(Date.now()));
    let lastSecond = -1;
    (function loop() {
      const now = Date.now();
      const st = state(now);
      const sec = Math.floor(now / 1000);
      if (sec !== lastSecond) { lastSecond = sec; updateNight(new Date(now)); }
      design.update(st);
      setTimeout(loop, tickMs());
    })();

    let last = 0, frameNo = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      frameNo++;
      if (frameNo % frameSkip()) return;
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
      last = ts;
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      design.frame(ctx, dt, ts / 1000, W, H);
      ctx.globalAlpha = 1;
    }

    drift(); setInterval(drift, 6000);
    resize();
    window.addEventListener("resize", resize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); if (design.measure) design.measure(); });
    if (design.measure) setInterval(design.measure, 1000);
    requestAnimationFrame(frame);
  }

  return {
    $, TAU, pad, clamp01, shortDate, hm, pct, parts, short, setText, setDigits, ring, setArc, tbdText,
    start, driftAt, share, reduce,
    get power() { return power; },
    get night() { return !!night; },
  };
})();

/* ---------- Hourglass: the sand that has fallen is the time already gone ---------- */
(() => {
  "use strict";
  const C = Core, $ = C.$;
  let box = null;            // placeholder rectangle in CSS px
  let geo = null;            // hourglass geometry, rebuilt when the box changes
  let elapsed = 0;
  let grain = null;          // grain texture
  const falling = [], bounce = [], motes = [];

  /* shape: half-width of the glass at height y */
  function build(b) {
    const capH = Math.max(6, b.h * 0.028);
    const R = (b.w / 2) / 1.2;
    const cx = b.x + b.w / 2;
    const top = b.y + capH + 2, bottom = b.y + b.h - capH - 2;
    const mid = (top + bottom) / 2;
    const neck = Math.max(1.8, R * 0.05);
    const half = (y) => {
      const u = y < mid ? (y - top) / (mid - top) : (bottom - y) / (bottom - mid);
      const k = Math.min(1, Math.max(0, u));
      const shape = Math.pow(Math.cos(k * Math.PI / 2), 0.72) * (1 - 0.13 * Math.pow(1 - k, 4));  // rounded shoulders
      return neck + (R - neck) * shape;
    };
    // area tables (1 px steps) to turn a fraction of sand into a height
    const N = Math.ceil(mid - top);
    const topArea = [0];      // area between level (mid - i) and the neck
    for (let i = 1; i <= N; i++) topArea[i] = topArea[i - 1] + 2 * half(mid - i + 0.5);
    const M = Math.ceil(bottom - mid);
    const botArea = [0];      // area between the bottom and level (bottom - i)
    for (let i = 1; i <= M; i++) botArea[i] = botArea[i - 1] + 2 * half(bottom - i + 0.5);
    const total = topArea[N];
    return { cx, top, bottom, mid, R, neck, capH, half, topArea, botArea, total, N, M };
  }

  function topLevel(g, fraction) {           // y of the sand surface in the upper bulb
    const target = fraction * g.total;
    let i = 0;
    while (i < g.N && g.topArea[i] < target) i++;
    return g.mid - i;
  }
  function pile(g, fraction) {               // flat level + mound height in the lower bulb
    const target = fraction * g.total;
    for (let i = 0; i <= g.M; i++) {
      const yb = g.bottom - i;
      const peak = Math.min(g.R * 0.32, (yb - g.mid) * 0.75);
      if (g.botArea[i] + g.half(yb) * peak * 0.66 >= target) return { yb, peak };
    }
    return { yb: g.mid, peak: 0 };
  }

  function makeGrain(g) {
    const c = document.createElement("canvas");
    const w = Math.ceil(g.R * 2.2), h = Math.ceil(g.bottom - g.top + 4);
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    for (let k = 0; k < w * h / 5; k++) {
      x.fillStyle = Math.random() < 0.5 ? "rgba(255,245,225,0.22)" : "rgba(40,20,5,0.3)";
      x.fillRect(Math.random() * w, Math.random() * h, 1, 1);
    }
    return c;
  }

  function wallPath(ctx, g, y1, y2, side) {   // trace one wall between two heights
    const step = 2;
    if (y1 < y2) for (let y = y1; y <= y2; y += step) ctx.lineTo(g.cx + side * g.half(y), y);
    else for (let y = y1; y >= y2; y -= step) ctx.lineTo(g.cx + side * g.half(y), y);
    ctx.lineTo(g.cx + side * g.half(y2), y2);
  }

  function sandFill(ctx, g, y0, y1, light, dark) {
    const grad = ctx.createLinearGradient(0, y0, 0, y1);
    grad.addColorStop(0, light); grad.addColorStop(1, dark);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.save(); ctx.clip();
    ctx.globalAlpha = 0.55;
    ctx.drawImage(grain, g.cx - g.R * 1.1, g.top - 2);
    ctx.restore();
  }

  const design = {
    setup() { },

    update(st) {
      elapsed = st.session;
      const left = st.sessionLeft;
      if (left <= 0) {
        C.setText($("dN"), "Good luck"); C.setText($("dU"), "");
        C.setDigits($("dT"), "The exam session has started");
        $("dPline").style.visibility = "hidden";
      } else {
        const t = C.parts(left);
        C.setText($("dN"), String(t.d)); C.setText($("dU"), t.d === 1 ? "day" : "days");
        C.setDigits($("dT"), `${t.h} h ${C.pad(t.m)} min ${C.pad(t.s)} s`);
        const [i, d] = C.pct(st.session, CONFIG.decimals.big);
        C.setDigits($("dP"), i + d);
      }
      const s = $("status");
      s.style.visibility = left <= 0 ? "hidden" : "visible";
      const html = st.status.code ? st.status.text.replace(st.status.code, `<b>${st.status.code}</b>`) : st.status.text;
      if (s.innerHTML !== html) s.innerHTML = html;
    },

    measure() {
      const r = $("glass").getBoundingClientRect();
      if (!r.width) return;
      if (!box || Math.abs(r.width - box.w) > 0.5 || Math.abs(r.height - box.h) > 0.5 || Math.abs(r.left - box.x) > 0.5 || Math.abs(r.top - box.y) > 0.5) {
        box = { x: r.left, y: r.top, w: r.width, h: r.height };
        geo = build(box);
        grain = makeGrain(geo);
      }
    },

    resize(W, H) {
      motes.length = 0;
      for (let k = 0; k < 28; k++) motes.push({ x: Math.random() * W, y: Math.random() * H, r: 0.4 + Math.random() * 0.8, vx: (Math.random() - 0.5) * 4, vy: -1 - Math.random() * 3, ph: Math.random() * C.TAU });
    },

    frame(ctx, dt, t, W, H) {
      if (!geo) return;
      const g = geo, share = C.share();
      const sand = !C.night ? ["#f5d9a6", "#c4925a", "#f1d39c", "#8f6435"] : ["#cdb48a", "#8e6b44", "#c9ae82", "#6a4b2a"];

      // warm light behind the glass
      const glow = ctx.createRadialGradient(g.cx, g.mid, 0, g.cx, g.mid, g.R * 2.6);
      glow.addColorStop(0, C.night ? "rgba(255,190,120,0.06)" : "rgba(255,190,120,0.13)");
      glow.addColorStop(1, "rgba(255,190,120,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(g.cx - g.R * 2.6, g.mid - g.R * 2.6, g.R * 5.2, g.R * 5.2);

      // dust in the light
      for (let k = 0, n = Math.round(motes.length * share); k < n; k++) {
        const m = motes[k];
        m.x += m.vx * dt; m.y += m.vy * dt;
        if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
        const near = Math.max(0, 1 - Math.hypot(m.x - g.cx, m.y - g.mid) / (g.R * 3));
        ctx.globalAlpha = (0.08 + 0.5 * near) * (0.6 + 0.4 * Math.sin(t + m.ph));
        ctx.fillStyle = "#ffe7c2";
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, C.TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // sand in the upper bulb, with a dip where it drains
      const remaining = 1 - elapsed;
      if (remaining > 0.0005) {
        const ys = Math.min(topLevel(g, remaining), g.mid - 1);
        const dip = Math.min((g.mid - ys) * 0.3, g.R * 0.15) * Math.min(1, elapsed * 40);
        ctx.beginPath();
        ctx.moveTo(g.cx - g.half(ys), ys);
        ctx.quadraticCurveTo(g.cx, ys + dip * 2, g.cx + g.half(ys), ys);
        wallPath(ctx, g, ys, g.mid, 1);
        wallPath(ctx, g, g.mid, ys, -1);
        ctx.closePath();
        sandFill(ctx, g, ys, g.mid, sand[0], sand[1]);
      }

      // the pile in the lower bulb
      let pileTop = g.bottom;
      if (elapsed > 0.0005) {
        const p = pile(g, Math.min(1, elapsed));
        pileTop = p.yb - p.peak;
        ctx.beginPath();
        ctx.moveTo(g.cx - g.half(p.yb), p.yb);
        ctx.quadraticCurveTo(g.cx - g.half(p.yb) * 0.35, p.yb - p.peak * 0.9, g.cx, pileTop);
        ctx.quadraticCurveTo(g.cx + g.half(p.yb) * 0.35, p.yb - p.peak * 0.9, g.cx + g.half(p.yb), p.yb);
        wallPath(ctx, g, p.yb, g.bottom, 1);
        wallPath(ctx, g, g.bottom, p.yb, -1);
        ctx.closePath();
        sandFill(ctx, g, pileTop, g.bottom, sand[2], sand[3]);
      }

      // the falling stream
      if (elapsed > 0 && elapsed < 1) {
        const thin = ctx.createLinearGradient(0, g.mid, 0, pileTop);
        thin.addColorStop(0, "rgba(245,217,166,0.55)"); thin.addColorStop(1, "rgba(245,217,166,0.25)");
        ctx.strokeStyle = thin; ctx.lineWidth = 0.9;
        ctx.beginPath(); ctx.moveTo(g.cx, g.mid); ctx.lineTo(g.cx, pileTop); ctx.stroke();
        if (C.power !== "saver" && !C.reduce) {
          const rate = 110 * share;
          let n = rate * dt;
          while (n > 0) {
            if (Math.random() < n) falling.push({ x: g.cx + (Math.random() - 0.5) * g.neck * 0.9, y: g.mid + Math.random() * 3, vy: 25 + Math.random() * 25 });
            n -= 1;
          }
        }
      }
      ctx.fillStyle = sand[0];
      for (let k = falling.length - 1; k >= 0; k--) {
        const p = falling[k];
        p.vy += 900 * dt; p.y += p.vy * dt;
        if (p.y >= pileTop) {
          falling.splice(k, 1);
          if (Math.random() < 0.25) bounce.push({ x: p.x, y: pileTop, vx: (Math.random() - 0.5) * 70, vy: -(20 + Math.random() * 45), t: 0 });
          continue;
        }
        ctx.globalAlpha = 0.9;
        ctx.fillRect(p.x - 0.5, p.y, 1.1, 1.6);
      }
      for (let k = bounce.length - 1; k >= 0; k--) {
        const p = bounce[k];
        p.t += dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.t > 0.35) { bounce.splice(k, 1); continue; }
        ctx.globalAlpha = 0.8 * (1 - p.t / 0.35);
        ctx.fillRect(p.x, p.y, 1, 1);
      }
      ctx.globalAlpha = 1;

      // the glass
      ctx.beginPath();
      ctx.moveTo(g.cx - g.half(g.top), g.top);
      wallPath(ctx, g, g.top, g.bottom, -1);
      ctx.lineTo(g.cx + g.half(g.bottom), g.bottom);
      wallPath(ctx, g, g.bottom, g.top, 1);
      ctx.closePath();
      const edge = ctx.createLinearGradient(g.cx - g.R, 0, g.cx + g.R, 0);
      edge.addColorStop(0, "rgba(255,255,255,0.34)");
      edge.addColorStop(0.5, "rgba(255,255,255,0.12)");
      edge.addColorStop(1, "rgba(255,255,255,0.26)");
      ctx.strokeStyle = edge; ctx.lineWidth = 1.1; ctx.stroke();
      // reflections on the left of each bulb
      ctx.lineCap = "round";
      for (const [a, b] of [[0.12, 0.62], [0.58, 0.9]]) {
        const y0 = g.top + (g.bottom - g.top) * a / 1, y1 = g.top + (g.bottom - g.top) * b / 1;
        ctx.beginPath();
        for (let y = y0; y <= y1; y += 2) {
          if (Math.abs(y - g.mid) < (g.bottom - g.top) * 0.08) { ctx.moveTo(g.cx - g.half(y) * 0.78, y); continue; }
          ctx.lineTo(g.cx - g.half(y) * 0.78, y);
        }
        const hl = ctx.createLinearGradient(0, y0, 0, y1);
        hl.addColorStop(0, "rgba(255,255,255,0)"); hl.addColorStop(0.5, "rgba(255,255,255,0.16)"); hl.addColorStop(1, "rgba(255,255,255,0)");
        ctx.strokeStyle = hl; ctx.lineWidth = 2.2; ctx.stroke();
      }

      // brass caps and posts
      const capW = g.R * 1.2;
      const brass = ctx.createLinearGradient(g.cx - capW, 0, g.cx + capW, 0);
      brass.addColorStop(0, "#3b2f20"); brass.addColorStop(0.35, "#8a7048"); brass.addColorStop(0.55, "#c9a76d"); brass.addColorStop(1, "#3b2f20");
      ctx.fillStyle = brass;
      const capY = [g.top - g.capH - 2, g.bottom + 2];
      for (const y of capY) {
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(g.cx - capW, y, capW * 2, g.capH, g.capH / 2); else ctx.rect(g.cx - capW, y, capW * 2, g.capH);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(201,167,109,0.45)";
      for (const side of [-1, 1]) ctx.fillRect(g.cx + side * g.R * 1.1 - 0.9, g.top - 2, 1.8, g.bottom - g.top + 4);
    },
  };
  Core.start(design);
})();
</script>
</body>
</html>
