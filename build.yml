name: Build wallpaper app

on:
  push:
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write the app
        run: |
          mkdir -p app/src/io/github/semesterwallpaper app/res/drawable app/res/xml app/assets/designs

          cat > app/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="io.github.semesterwallpaper">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <application
                  android:label="Semester Wallpaper"
                  android:icon="@drawable/ic"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".ChooserActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Black.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".WallpaperSvc"
                      android:exported="true"
                      android:label="Semester Wallpaper"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/res/xml/wallpaper.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:thumbnail="@drawable/ic" />
          EOF

          cat > app/res/drawable/ic.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z" />
              <path android:strokeColor="#3300E5FF" android:strokeWidth="7"
                  android:pathData="M54,28 a26,26 0 1,1 -0.01,0" />
              <path android:strokeColor="#FF2BD6" android:strokeWidth="7" android:strokeLineCap="round"
                  android:pathData="M54,28 A26,26 0 1,1 28,54" />
          </vector>
          EOF

          cat > app/src/io/github/semesterwallpaper/Store.java <<'EOF'
          package io.github.semesterwallpaper;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.BatteryManager;
          import android.os.PowerManager;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          // Shared by the wallpaper and the chooser: which designs exist (every .html file at the
          // root of the GitHub repository), their saved copies, the chosen one, and the battery mode.
          final class Store {
              static final String REPO = "__REPO__";
              static final String BRANCH = "__BRANCH__";
              static final String DEFAULT = "index.html";
              static final Pattern NAME = Pattern.compile("[A-Za-z0-9._-]+\\.html");
              static final Pattern TITLE = Pattern.compile("<title>([^<]*)</title>", Pattern.CASE_INSENSITIVE);

              private Store() { }

              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("wallpaper", Context.MODE_PRIVATE);
              }

              static boolean valid(String file) {
                  return file != null && NAME.matcher(file).matches();
              }

              static String selected(Context c) {
                  String f = prefs(c).getString("design", DEFAULT);
                  return valid(f) ? f : DEFAULT;
              }

              static void choose(Context c, String file) {
                  if (valid(file)) prefs(c).edit().putString("design", file).apply();
              }

              static File dir(Context c) {
                  File d = new File(c.getFilesDir(), "designs");
                  if (!d.exists()) d.mkdirs();
                  return d;
              }

              static String readAll(InputStream in) throws Exception {
                  try {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return new String(out.toByteArray(), "UTF-8");
                  } finally {
                      in.close();
                  }
              }

              static String read(Context c, String file) {
                  if (!valid(file)) file = DEFAULT;
                  try {
                      File f = new File(dir(c), file);
                      if (f.exists()) return readAll(new FileInputStream(f));
                  } catch (Exception ignored) { }
                  try {
                      return readAll(c.getAssets().open("designs/" + file));
                  } catch (Exception ignored) { }
                  if (!DEFAULT.equals(file)) return read(c, DEFAULT);
                  return "<!doctype html><html><body style=\"background:#000\"></body></html>";
              }

              // Saves a design; returns true if it changed. Wallpapers listen to "rev" and reload.
              static boolean save(Context c, String file, String html) {
                  if (!valid(file)) return false;
                  File f = new File(dir(c), file);
                  try {
                      if (f.exists() && html.equals(readAll(new FileInputStream(f)))) return false;
                      FileOutputStream out = new FileOutputStream(f);
                      try {
                          out.write(html.getBytes("UTF-8"));
                      } finally {
                          out.close();
                      }
                      prefs(c).edit().putLong("rev", System.currentTimeMillis()).apply();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              static String get(String url, boolean api) {
                  HttpURLConnection conn = null;
                  try {
                      conn = (HttpURLConnection) new URL(url).openConnection();
                      conn.setConnectTimeout(10000);
                      conn.setReadTimeout(15000);
                      conn.setUseCaches(false);
                      conn.setRequestProperty("User-Agent", "semester-wallpaper");
                      if (api) conn.setRequestProperty("Accept", "application/vnd.github+json");
                      if (conn.getResponseCode() != 200) return null;
                      return readAll(conn.getInputStream());
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              static String download(String file) {
                  if (!valid(file)) return null;
                  String html = get("https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/" + file
                          + "?t=" + System.currentTimeMillis(), false);
                  return html != null && html.contains("</html>") ? html : null;
              }

              static List<String> listRemote() {
                  String json = get("https://api.github.com/repos/" + REPO + "/contents/?ref=" + BRANCH, true);
                  if (json == null) return null;
                  try {
                      JSONArray arr = new JSONArray(json);
                      List<String> out = new ArrayList<String>();
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          String name = o.optString("name");
                          if ("file".equals(o.optString("type")) && valid(name)) out.add(name);
                      }
                      return out;
                  } catch (Exception e) {
                      return null;
                  }
              }

              static void sort(List<String> list) {
                  Collections.sort(list);
                  if (list.remove(DEFAULT)) list.add(0, DEFAULT);
              }

              static List<String> listLocal(Context c) {
                  List<String> out = new ArrayList<String>();
                  String saved = prefs(c).getString("list", null);
                  if (saved != null && saved.length() > 0) {
                      for (String s : saved.split(",")) if (valid(s)) out.add(s);
                  } else {
                      try {
                          String[] bundled = c.getAssets().list("designs");
                          if (bundled != null) for (String s : bundled) if (valid(s)) out.add(s);
                      } catch (Exception ignored) { }
                  }
                  if (out.isEmpty()) out.add(DEFAULT);
                  sort(out);
                  return out;
              }

              // Downloads the list of designs and every design. Returns false if GitHub can't be reached.
              static boolean refreshAll(Context c) {
                  List<String> list = listRemote();
                  if (list == null) return false;
                  sort(list);
                  StringBuilder names = new StringBuilder();
                  for (String f : list) {
                      String html = download(f);
                      if (html != null) save(c, f, html);
                      if (names.length() > 0) names.append(',');
                      names.append(f);
                  }
                  prefs(c).edit().putString("list", names.toString()).putLong("checked", System.currentTimeMillis()).apply();
                  return true;
              }

              static String title(String html, String fallback) {
                  Matcher m = TITLE.matcher(html);
                  return m.find() ? m.group(1).trim() : fallback;
              }

              // full: everything. eco: half the particles and frame rate. saver: minimal animation.
              static JSONObject power(Context c) {
                  JSONObject o = new JSONObject();
                  try {
                      BatteryManager bm = (BatteryManager) c.getSystemService(Context.BATTERY_SERVICE);
                      PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                      int level = bm != null ? bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) : 100;
                      if (level < 0 || level > 100) level = 100;
                      boolean charging = bm != null && bm.isCharging();
                      boolean saver = pm != null && pm.isPowerSaveMode();
                      String mode = charging ? "full" : (saver || level <= 20) ? "saver" : level <= 50 ? "eco" : "full";
                      o.put("mode", mode);
                      o.put("level", level);
                      o.put("charging", charging);
                      o.put("powerSave", saver);
                  } catch (Exception ignored) { }
                  return o;
              }
          }
          EOF

          cat > app/src/io/github/semesterwallpaper/WallpaperSvc.java <<'EOF'
          package io.github.semesterwallpaper;

          import android.app.Presentation;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.wallpaper.WallpaperService;
          import android.view.SurfaceHolder;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          // Live wallpaper that shows the chosen design. The page is drawn by a WebView placed on a
          // private virtual display whose output is the wallpaper surface.
          public class WallpaperSvc extends WallpaperService {
              static final String BASE_URL = "https://semester.wallpaper/";
              static final long CHECK_EVERY_MS = 30L * 60L * 1000L;
              static final long POWER_EVERY_MS = 60L * 1000L;
              static volatile long lastCheck = 0L;

              @Override
              public Engine onCreateEngine() {
                  return new PageEngine();
              }

              class PageEngine extends Engine {
                  final Handler main = new Handler(Looper.getMainLooper());
                  VirtualDisplay display;
                  Presentation presentation;
                  WebView web;
                  String current;
                  String power;
                  boolean shown;
                  int lastW, lastH;

                  // Reload when another design is chosen or the chosen one is updated.
                  final SharedPreferences.OnSharedPreferenceChangeListener prefsListener =
                          new SharedPreferences.OnSharedPreferenceChangeListener() {
                              @Override
                              public void onSharedPreferenceChanged(SharedPreferences sp, String key) {
                                  if ("design".equals(key) || "rev".equals(key)) reloadIfChanged();
                              }
                          };

                  // Battery check once a minute while visible.
                  final Runnable powerTick = new Runnable() {
                      @Override
                      public void run() {
                          updatePower();
                          if (shown) main.postDelayed(this, POWER_EVERY_MS);
                      }
                  };

                  @Override
                  public void onCreate(SurfaceHolder holder) {
                      super.onCreate(holder);
                      Store.prefs(WallpaperSvc.this).registerOnSharedPreferenceChangeListener(prefsListener);
                  }

                  @Override
                  public void onSurfaceChanged(SurfaceHolder holder, int format, int width, int height) {
                      super.onSurfaceChanged(holder, format, width, height);
                      if (width <= 0 || height <= 0) return;
                      if (display != null && width == lastW && height == lastH) return;
                      lastW = width;
                      lastH = height;
                      teardown();
                      try {
                          int dpi = getResources().getDisplayMetrics().densityDpi;
                          DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                          display = dm.createVirtualDisplay("semester-wallpaper", width, height, dpi,
                                  holder.getSurface(), DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY);
                          presentation = new Presentation(WallpaperSvc.this, display.getDisplay());
                          presentation.getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                          web = new WebView(presentation.getContext());
                          web.setBackgroundColor(Color.BLACK);
                          web.setVerticalScrollBarEnabled(false);
                          web.setHorizontalScrollBarEnabled(false);
                          WebSettings s = web.getSettings();
                          s.setJavaScriptEnabled(true);
                          s.setDomStorageEnabled(true);
                          web.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  power = null;
                                  updatePower();
                              }
                          });
                          presentation.setContentView(web, new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          presentation.show();
                          if (current == null) current = Store.read(WallpaperSvc.this, Store.selected(WallpaperSvc.this));
                          web.loadDataWithBaseURL(BASE_URL, current, "text/html", "utf-8", null);
                          if (!shown) web.onPause();
                      } catch (Exception e) {
                          teardown();
                      }
                      checkForUpdate();
                  }

                  @Override
                  public void onVisibilityChanged(boolean visible) {
                      super.onVisibilityChanged(visible);
                      shown = visible;
                      main.removeCallbacks(powerTick);
                      if (web == null) return;
                      if (visible) {
                          web.onResume();
                          reloadIfChanged();
                          main.post(powerTick);
                          checkForUpdate();
                      } else {
                          web.onPause();
                      }
                  }

                  void reloadIfChanged() {
                      String html = Store.read(WallpaperSvc.this, Store.selected(WallpaperSvc.this));
                      if (!html.equals(current)) show(html);
                  }

                  void show(String html) {
                      current = html;
                      if (web != null) web.loadDataWithBaseURL(BASE_URL, html, "text/html", "utf-8", null);
                  }

                  void updatePower() {
                      String p = Store.power(WallpaperSvc.this).toString();
                      if (p.equals(power)) return;
                      power = p;
                      if (web != null) {
                          web.evaluateJavascript("window.__power=" + p
                                  + ";window.dispatchEvent(new CustomEvent('wallpaper-power',{detail:window.__power}));", null);
                      }
                  }

                  void checkForUpdate() {
                      long now = System.currentTimeMillis();
                      if (now - lastCheck < CHECK_EVERY_MS) return;
                      lastCheck = now;
                      final Context ctx = WallpaperSvc.this;
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              String file = Store.selected(ctx);
                              String html = Store.download(file);
                              if (html != null) Store.save(ctx, file, html);
                          }
                      }).start();
                  }

                  @Override
                  public void onSurfaceDestroyed(SurfaceHolder holder) {
                      main.removeCallbacks(powerTick);
                      teardown();
                      lastW = 0;
                      lastH = 0;
                      super.onSurfaceDestroyed(holder);
                  }

                  @Override
                  public void onDestroy() {
                      main.removeCallbacks(powerTick);
                      Store.prefs(WallpaperSvc.this).unregisterOnSharedPreferenceChangeListener(prefsListener);
                      teardown();
                      super.onDestroy();
                  }

                  void teardown() {
                      if (presentation != null) {
                          try { presentation.dismiss(); } catch (Exception ignored) { }
                          presentation = null;
                      }
                      if (web != null) {
                          try { web.destroy(); } catch (Exception ignored) { }
                          web = null;
                      }
                      if (display != null) {
                          display.release();
                          display = null;
                      }
                  }
              }
          }
          EOF

          cat > app/src/io/github/semesterwallpaper/ChooserActivity.java <<'EOF'
          package io.github.semesterwallpaper;

          import android.app.Activity;
          import android.app.WallpaperInfo;
          import android.app.WallpaperManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONArray;
          import org.json.JSONObject;

          // The app screen: live previews of every design, a button to use one, and battery status.
          public class ChooserActivity extends Activity {
              WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  try {
                      getWindow().setStatusBarColor(Color.BLACK);
                      getWindow().setNavigationBarColor(Color.BLACK);
                  } catch (Exception ignored) { }
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(web);
                  web.loadUrl("file:///android_asset/chooser.html");
                  refresh();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.evaluateJavascript("window.onShow && window.onShow()", null);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }

              void refresh() {
                  final Context ctx = getApplicationContext();
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          final boolean ok = Store.refreshAll(ctx);
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  if (web != null) web.evaluateJavascript("window.onDesigns && window.onDesigns(" + ok + ")", null);
                              }
                          });
                      }
                  }).start();
              }

              boolean isActive() {
                  try {
                      WallpaperInfo info = WallpaperManager.getInstance(this).getWallpaperInfo();
                      return info != null && getPackageName().equals(info.getPackageName());
                  } catch (Exception e) {
                      return false;
                  }
              }

              void openPicker() {
                  try {
                      Intent i = new Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER);
                      i.putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                              new ComponentName(this, WallpaperSvc.class));
                      startActivity(i);
                  } catch (Exception e) {
                      try {
                          startActivity(new Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER));
                      } catch (Exception ignored) { }
                  }
              }

              // Called from chooser.html as window.Android.*
              class Bridge {
                  @JavascriptInterface
                  public String designs() {
                      JSONArray arr = new JSONArray();
                      for (String f : Store.listLocal(ChooserActivity.this)) {
                          JSONObject o = new JSONObject();
                          try {
                              o.put("file", f);
                              o.put("title", Store.title(Store.read(ChooserActivity.this, f), f.replace(".html", "")));
                          } catch (Exception ignored) { }
                          arr.put(o);
                      }
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public String html(String file) {
                      return Store.read(ChooserActivity.this, file);
                  }

                  @JavascriptInterface
                  public String selected() {
                      return Store.selected(ChooserActivity.this);
                  }

                  @JavascriptInterface
                  public void choose(String file) {
                      Store.choose(ChooserActivity.this, file);
                  }

                  @JavascriptInterface
                  public boolean active() {
                      return isActive();
                  }

                  @JavascriptInterface
                  public void setWallpaper() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              openPicker();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void refresh() {
                      ChooserActivity.this.refresh();
                  }

                  @JavascriptInterface
                  public String power() {
                      return Store.power(ChooserActivity.this).toString();
                  }

                  @JavascriptInterface
                  public long checked() {
                      return Store.prefs(ChooserActivity.this).getLong("checked", 0L);
                  }
              }
          }
          EOF

          cat > app/assets/chooser.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Wallpapers</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;500&display=swap" rel="stylesheet">
          <style>
          :root {
            color-scheme: dark;
            --bg: #000000;
            --ink: #ffffff;
            --ink-2: rgba(255, 255, 255, 0.64);
            --ink-3: rgba(255, 255, 255, 0.38);
            --line: rgba(255, 255, 255, 0.16);
            --card-w: min(46vw, 210px);
          }
          * { box-sizing: border-box; }
          html, body { margin: 0; background: var(--bg); color: var(--ink); }
          body {
            font-family: "Inter Tight", Arial, "Helvetica Neue", sans-serif; font-weight: 300;
            padding: calc(env(safe-area-inset-top, 0px) + 28px) 0 calc(env(safe-area-inset-bottom, 0px) + 28px);
            -webkit-tap-highlight-color: transparent;
          }
          .wrap { padding: 0 24px; }
          h1 { margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
          .sub { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); }

          .cards {
            display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 24px 24px 8px; scrollbar-width: none;
          }
          .cards::-webkit-scrollbar { display: none; }
          .card {
            flex: none; width: var(--card-w); scroll-snap-align: start;
            background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
          }
          .frame {
            position: relative; width: 100%; aspect-ratio: 384 / 832; overflow: hidden;
            border-radius: 22px; border: 1px solid var(--line); background: #000;
            transition: border-color 0.2s, box-shadow 0.2s;
          }
          .frame iframe {
            position: absolute; left: 0; top: 0; width: 384px; height: 832px; border: 0;
            transform-origin: 0 0; pointer-events: none;
          }
          .card[aria-pressed="true"] .frame { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
          .name { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 16px; font-weight: 500; }
          .tag { font-size: 12px; font-weight: 500; color: var(--ink-2); }

          .actions { display: grid; gap: 10px; margin-top: 20px; }
          button.primary, button.secondary {
            width: 100%; min-height: 52px; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer;
          }
          button.primary { background: var(--ink); color: #000; border: 0; }
          button.primary:disabled { background: rgba(255, 255, 255, 0.14); color: var(--ink-2); cursor: default; }
          button.secondary { background: none; color: var(--ink); border: 1px solid var(--line); }
          button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

          section.info { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
          section.info h2 { margin: 0 0 6px; font-size: 15px; font-weight: 500; }
          section.info p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
          .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
          .link { background: none; border: 0; color: var(--ink); font: inherit; font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; cursor: pointer; }
          .empty { padding: 40px 24px; color: var(--ink-2); font-size: 15px; }
          </style>
          </head>
          <body>
          <div class="wrap">
            <h1>Wallpapers</h1>
            <p class="sub" id="sub">Pick a design. Your wallpaper switches right away.</p>
          </div>

          <div class="cards" id="cards" role="list"></div>

          <div class="wrap">
            <div class="actions">
              <button class="primary" id="use" type="button">Use this design</button>
              <button class="secondary" id="set" type="button" hidden>Set as wallpaper</button>
            </div>

            <section class="info">
              <h2 id="powerTitle">Battery</h2>
              <p id="powerText"></p>
            </section>

            <section class="info">
              <div class="row">
                <div>
                  <h2>New designs</h2>
                  <p id="checked">Not checked yet</p>
                </div>
                <button class="link" id="refresh" type="button">Check now</button>
              </div>
            </section>
          </div>

          <script>
          (() => {
            "use strict";
            const A = window.Android;
            const $ = (id) => document.getElementById(id);
            const cards = new Map(); // file -> { el, iframe, html }
            let picked = null;

            const POWER_TEXT = {
              full: "Full animation.",
              eco: "Lighter animation to save battery: half the particles and frame rate.",
              saver: "Minimal animation to save battery.",
            };

            function render() {
              let list = [];
              try { list = JSON.parse(A.designs()); } catch (e) { list = []; }
              const inUse = A.selected();
              if (!picked || !list.some((d) => d.file === picked)) picked = inUse;
              const box = $("cards");
              if (!list.length) { box.innerHTML = '<p class="empty">No designs yet. Check your connection, then tap “Check now”.</p>'; return; }
              const keep = new Set(list.map((d) => d.file));
              for (const [file, c] of cards) if (!keep.has(file)) { c.el.remove(); cards.delete(file); }
              if (box.querySelector(".empty")) box.innerHTML = "";

              list.forEach((d, idx) => {
                let c = cards.get(d.file);
                if (!c) {
                  const el = document.createElement("button");
                  el.className = "card"; el.type = "button"; el.setAttribute("role", "listitem");
                  el.innerHTML = '<div class="frame"><iframe tabindex="-1" aria-hidden="true"></iframe></div><div class="name"><span class="title"></span><span class="tag"></span></div>';
                  el.addEventListener("click", () => { picked = d.file; update(); });
                  c = { el, iframe: el.querySelector("iframe"), html: null };
                  cards.set(d.file, c);
                }
                if (box.children[idx] !== c.el) box.insertBefore(c.el, box.children[idx] || null);
                c.el.querySelector(".title").textContent = d.title;
                const html = A.html(d.file);
                if (html !== c.html) {
                  c.html = html;
                  c.iframe.onload = () => {
                    try {
                      const w = c.iframe.contentWindow;
                      w.__power = { mode: "eco" };
                      w.dispatchEvent(new w.CustomEvent("wallpaper-power", { detail: w.__power }));
                    } catch (e) { /* preview keeps full animation */ }
                  };
                  c.iframe.srcdoc = html;
                }
              });
              scale();
              update();
            }

            function scale() {
              for (const c of cards.values()) {
                const w = c.el.querySelector(".frame").clientWidth;
                if (w) c.iframe.style.transform = `scale(${w / 384})`;
              }
            }

            function update() {
              const inUse = A.selected();
              const active = A.active();
              for (const [file, c] of cards) {
                c.el.setAttribute("aria-pressed", String(file === picked));
                c.el.querySelector(".tag").textContent = file === inUse && active ? "In use" : file === inUse ? "Chosen" : "";
              }
              const use = $("use");
              use.disabled = picked === inUse;
              use.textContent = picked === inUse ? (active ? "In use" : "Chosen") : "Use this design";
              $("set").hidden = active;
              $("sub").textContent = active
                ? "Pick a design. Your wallpaper switches right away."
                : "Pick a design, then set it as your wallpaper.";
              showPower();
            }

            function showPower() {
              let p = { mode: "full", level: 100, charging: false, powerSave: false };
              try { p = JSON.parse(A.power()); } catch (e) { /* keep defaults */ }
              const state = p.charging ? `Charging, ${p.level}%` : p.powerSave ? `Power saving mode on, ${p.level}%` : `${p.level}%`;
              $("powerTitle").textContent = `Battery: ${state}`;
              $("powerText").textContent = `${POWER_TEXT[p.mode] || POWER_TEXT.full} Full animation while charging or above 50%, lighter between 20 and 50%, minimal below 20% or in power saving mode.`;
            }

            function showChecked(ok) {
              const t = Number(A.checked()) || 0;
              if (ok === false) { $("checked").textContent = "Couldn’t reach GitHub. Showing saved designs."; return; }
              if (!t) { $("checked").textContent = "Checking…"; return; }
              const min = Math.round((Date.now() - t) / 60000);
              $("checked").textContent = min < 1 ? "Up to date, checked just now" : `Up to date, checked ${min} min ago`;
            }

            $("use").addEventListener("click", () => {
              A.choose(picked);
              if (!A.active()) A.setWallpaper();
              update();
            });
            $("set").addEventListener("click", () => { A.choose(picked); A.setWallpaper(); });
            $("refresh").addEventListener("click", () => { $("checked").textContent = "Checking…"; A.refresh(); });

            window.onDesigns = (ok) => { render(); showChecked(ok); };
            window.onShow = () => { update(); showChecked(); };
            window.addEventListener("resize", scale);
            setInterval(showPower, 30000);

            render();
            showChecked();
          })();
          </script>
          </body>
          </html>
          EOF

          # every .html file at the root of the repository is a design; bundle them for offline use
          for f in *.html; do
            [ -f "$f" ] && cp "$f" app/assets/designs/
          done
          ls app/assets/designs
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#; s#__BRANCH__#${GITHUB_REF_NAME}#" app/src/io/github/semesterwallpaper/Store.java
          grep -n "static final String REPO\|static final String BRANCH" app/src/io/github/semesterwallpaper/Store.java

      - name: Get the signing key
        run: |
          if [ ! -f wallpaper-key.p12 ]; then
            keytool -genkeypair -keystore wallpaper-key.p12 -storetype PKCS12 \
              -storepass semester -keypass semester -alias wallpaper \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Semester Wallpaper"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          BT="$SDK/build-tools/34.0.0"
          JAR="$SDK/platforms/android-34/android.jar"
          cd app
          mkdir -p build/compiled build/classes
          for f in $(find res -type f); do
            "$BT/aapt2" compile -o build/compiled "$f"
          done
          "$BT/aapt2" link -o build/base.apk -I "$JAR" --manifest AndroidManifest.xml -A assets \
            --min-sdk-version 26 --target-sdk-version 34 \
            --version-code "$GITHUB_RUN_NUMBER" --version-name "1.$GITHUB_RUN_NUMBER" \
            build/compiled/*.flat
          javac -source 8 -target 8 -bootclasspath "$JAR" -encoding UTF-8 -d build/classes \
            $(find src -name '*.java')
          "$BT/d8" --release --min-api 26 --lib "$JAR" --output build $(find build/classes -name '*.class')
          (cd build && zip -q -u base.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk
          "$BT/apksigner" sign --ks ../wallpaper-key.p12 --ks-pass pass:semester --key-pass pass:semester \
            --ks-key-alias wallpaper --out ../semester-wallpaper.apk build/aligned.apk
          "$BT/apksigner" verify ../semester-wallpaper.apk
          ls -l ../semester-wallpaper.apk

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" semester-wallpaper.apk \
            --title "Semester wallpaper ${GITHUB_RUN_NUMBER}" \
            --notes "Open this page on your phone and tap semester-wallpaper.apk to install it." \
            --latest
          if [ "${NEW_KEY:-0}" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add wallpaper-key.p12
            git commit -m "Save the signing key so updates install over the old app"
            git push || echo "Could not save the signing key"
          fi
