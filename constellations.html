<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>Constellations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fit: 1;
  --top-space: 20dvh;
  --bottom-space: 19dvh;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#stage {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  box-sizing: border-box;
  padding: var(--top-space) 6vw var(--bottom-space);
  display: flex; flex-direction: column; justify-content: center;
  gap: calc(3.2dvh * var(--fit));
  transition: transform 6s linear;
}
#stage > * { flex-shrink: 0; }
#night { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #000000; opacity: 0; transition: opacity 90s linear; }
:root[data-power="saver"] *, :root[data-power="saver"] *::before, :root[data-power="saver"] *::after { animation-play-state: paused !important; }

body { background: #02030a; }
#stage { display: none; }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <span></span>
</main>

<div id="night"></div>

<script>
/* ---------- art core: animation loop, battery modes, night dimming, drift (no timetable) ---------- */
const Art = (() => {
  "use strict";
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  let power = (window.__power && window.__power.mode) || "full";
  root.dataset.power = power;
  window.addEventListener("wallpaper-power", (e) => {
    power = (e.detail && e.detail.mode) || "full";
    root.dataset.power = power;
  });
  const NIGHT_FROM = 23 * 60, NIGHT_TO = 7 * 60, NIGHT_BRIGHTNESS = 0.45;
  let night = null;
  function updateNight() {
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    const n = m >= NIGHT_FROM || m < NIGHT_TO;
    if (n !== night) {
      night = n;
      root.classList.toggle("night", n);
      $("night").style.opacity = n ? String(1 - NIGHT_BRIGHTNESS) : "0";
    }
  }
  const share = () => (power === "saver" ? 0.2 : power === "eco" ? 0.5 : 1);
  const frameSkip = () => (power === "saver" ? 4 : power === "eco" || night ? 2 : 1);
  const driftAt = (t) => [Math.sin(t / 173) * 6, Math.cos(t / 241) * 8];
  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function start(design) {
    const cvs = $("fx"), ctx = cvs.getContext("2d"), stage = $("stage");
    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      design.resize(W, H, dpr);
    }
    let last = 0, frameNo = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      frameNo++;
      if (frameNo % frameSkip()) return;
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
      last = ts;
      if (!W) return;
      const [dx, dy] = driftAt(Date.now() / 1000);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.translate(dx, dy);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      design.frame(ctx, dt, ts / 1000, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
    function drift() {
      const [dx, dy] = driftAt(Date.now() / 1000);
      if (stage) stage.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    }
    updateNight(); setInterval(updateNight, 30000);
    drift(); setInterval(drift, 6000);
    resize();
    window.addEventListener("resize", resize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(frame);
  }
  return { start, $, TAU, share, reduce, get power() { return power; }, get night() { return !!night; } };
})();

/* ---------- Constellations: a sky that draws figures of its own, under the real moon ---------- */
(() => {
  "use strict";
  const A = Art;
  let W = 0, H = 0, DPR = 1, sky = null;
  const bright = [], meteors = [];
  let cur = null, nextIn = 2, meteorIn = 12;
  const rnd = (a, b) => a + Math.random() * (b - a);

  // invented figures: points (unit square) and the lines between them
  const FIGURES = [
    { name: "La Barque", p: [[0, .62], [.22, .82], [.78, .82], [1, .62], [.5, .62], [.5, 0], [.86, .5], [.12, .5]], e: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 0], [4, 5], [5, 6], [6, 4], [5, 7], [7, 4]] },
    { name: "L'Hirondelle", p: [[0, .2], [.3, .42], [.5, .5], [.7, .42], [1, .2], [.5, .62], [.38, 1], [.62, 1]], e: [[0, 1], [1, 2], [2, 3], [3, 4], [2, 5], [5, 6], [5, 7]] },
    { name: "Le Phare", p: [[.4, 1], [.6, 1], [.56, .35], [.44, .35], [.5, .2], [1, .05], [1, .4], [0, .12]], e: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 2], [4, 5], [4, 6], [4, 7]] },
    { name: "Le Cerf-volant", p: [[.5, 0], [.85, .3], [.5, .7], [.15, .3], [.42, .8], [.58, .9], [.46, 1]], e: [[0, 1], [1, 2], [2, 3], [3, 0], [0, 2], [2, 4], [4, 5], [5, 6]] },
    { name: "La Lanterne", p: [[.5, 0], [.3, .22], [.7, .22], [.18, .55], [.82, .55], [.3, .88], [.7, .88], [.5, 1]], e: [[0, 1], [0, 2], [1, 3], [2, 4], [3, 5], [4, 6], [5, 7], [6, 7], [1, 2], [5, 6]] },
    { name: "Le Voilier des neiges", p: [[0, .7], [1, .7], [.8, .9], [.2, .9], [.5, .7], [.5, .05], [.85, .62], [.25, .62], [.5, .38]], e: [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 4], [5, 7], [7, 4], [8, 6]] },
  ];

  function moonPhase(date) {                 // 0 = new, 0.5 = full
    const synodic = 29.530588853;
    const ref = Date.UTC(2000, 0, 6, 18, 14);
    const days = (date.getTime() - ref) / 86400000;
    return ((days / synodic) % 1 + 1) % 1;
  }

  function build() {
    sky = document.createElement("canvas");
    sky.width = Math.round(W * DPR); sky.height = Math.round(H * DPR);
    const c = sky.getContext("2d"); c.scale(DPR, DPR);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#010208"); g.addColorStop(0.55, "#040817"); g.addColorStop(1, "#08102a");
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // the Milky Way: a soft diagonal band, dense with faint stars
    const ax = -W * 0.2, ay = H * 0.95, bx = W * 1.2, by = H * 0.05;
    for (let k = 0; k < 70; k++) {
      const q = Math.random(), x = ax + (bx - ax) * q + rnd(-40, 40), y = ay + (by - ay) * q + rnd(-50, 50), r = rnd(40, 120);
      const gg = c.createRadialGradient(x, y, 0, x, y, r);
      gg.addColorStop(0, `rgba(${150 + rnd(-20, 30)},${160 + rnd(-20, 20)},${210},0.035)`); gg.addColorStop(1, "rgba(150,160,210,0)");
      c.fillStyle = gg; c.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (let k = 0; k < W * H / 70; k++) {
      let x, y;
      if (Math.random() < 0.55) { const q = Math.random(); x = ax + (bx - ax) * q + (Math.random() + Math.random() - 1) * 70; y = ay + (by - ay) * q + (Math.random() + Math.random() - 1) * 90; }
      else { x = Math.random() * W; y = Math.random() * H; }
      const s = Math.pow(Math.random(), 3) * 1.1 + 0.25;
      const tint = Math.random();
      c.fillStyle = tint < 0.2 ? "rgba(255,226,196," : tint < 0.45 ? "rgba(200,215,255," : "rgba(240,244,255,";
      c.fillStyle += `${0.35 + Math.random() * 0.65})`;
      c.beginPath(); c.arc(x, y, s, 0, A.TAU); c.fill();
    }
    bright.length = 0;
    for (let k = 0; k < 70; k++) bright.push({ x: Math.random() * W, y: rnd(H * 0.05, H), r: rnd(0.8, 1.8), ph: rnd(0, A.TAU), tw: rnd(0.6, 2), warm: Math.random() < 0.25 });
  }

  function star(ctx, x, y, r, a, warm) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
    g.addColorStop(0, warm ? `rgba(255,236,210,${a})` : `rgba(235,242,255,${a})`);
    g.addColorStop(0.25, warm ? `rgba(255,210,170,${a * 0.35})` : `rgba(180,205,255,${a * 0.35})`);
    g.addColorStop(1, "rgba(180,205,255,0)");
    ctx.fillStyle = g; ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
  }

  function newFigure() {
    const f = FIGURES[(Math.random() * FIGURES.length) | 0];
    const size = rnd(0.42, 0.56) * W;
    const x0 = rnd(W * 0.06, W * 0.94 - size), y0 = rnd(H * 0.3, H * 0.78 - size);
    const pts = f.p.map(([u, v]) => ({ x: x0 + u * size + rnd(-6, 6), y: y0 + v * size + rnd(-6, 6) }));
    return { name: f.name, pts, e: f.e, t: 0, x0, y0, size };
  }

  function drawMoon(ctx, t) {
    const ph = moonPhase(new Date());
    const x = W * 0.8, y = H * 0.25, r = 13;
    const halo = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
    const lit = 0.5 - 0.5 * Math.cos(ph * A.TAU);              // share of the disc that is lit
    halo.addColorStop(0, `rgba(230,236,255,${0.1 + 0.18 * lit})`); halo.addColorStop(1, "rgba(230,236,255,0)");
    ctx.fillStyle = halo; ctx.fillRect(x - r * 6, y - r * 6, r * 12, r * 12);
    ctx.fillStyle = "rgba(40,46,70,0.9)";
    ctx.beginPath(); ctx.arc(x, y, r, 0, A.TAU); ctx.fill();
    // lit part: half disc on the lit side plus an ellipse for the terminator
    const waxing = ph < 0.5, k = Math.cos(ph * A.TAU);          // 1 new, -1 full
    ctx.fillStyle = "#eef1fb";
    ctx.beginPath();
    ctx.arc(x, y, r, -Math.PI / 2, Math.PI / 2, !waxing);
    ctx.ellipse(x, y, Math.abs(k) * r, r, 0, Math.PI / 2, -Math.PI / 2, (k > 0) === waxing);
    ctx.fill();
  }

  const design = {
    resize(w, h, dpr) { W = w; H = h; DPR = dpr; build(); cur = null; nextIn = 1.5; },

    frame(ctx, dt, t) {
      if (!sky) return;
      ctx.drawImage(sky, 0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";
      for (const s of bright) star(ctx, s.x, s.y, s.r, 0.45 + 0.4 * Math.sin(t * s.tw + s.ph), s.warm);

      // one figure at a time: stars brighten, lines are drawn, the name appears, then it all fades
      if (!cur) { nextIn -= dt; if (nextIn <= 0) cur = newFigure(); }
      if (cur) {
        cur.t += A.reduce ? 0 : dt;
        const T = cur.t, total = 34;
        const fadeOut = T > total - 5 ? Math.max(0, (total - T) / 5) : 1;
        const a = Math.min(1, T / 2) * fadeOut;
        for (const p of cur.pts) star(ctx, p.x, p.y, 1.6, 0.9 * a, false);
        const draw = Math.min(1, Math.max(0, (T - 1.5) / 7));
        const n = cur.e.length, upto = draw * n;
        ctx.strokeStyle = `rgba(190,210,255,${0.45 * fadeOut})`;
        ctx.lineWidth = 0.8;
        for (let i = 0; i < n; i++) {
          if (i >= upto) break;
          const q = Math.min(1, upto - i);
          const A0 = cur.pts[cur.e[i][0]], B0 = cur.pts[cur.e[i][1]];
          ctx.beginPath(); ctx.moveTo(A0.x, A0.y); ctx.lineTo(A0.x + (B0.x - A0.x) * q, A0.y + (B0.y - A0.y) * q); ctx.stroke();
        }
        ctx.globalCompositeOperation = "source-over";
        const nameA = Math.min(1, Math.max(0, (T - 8.5) / 2.5)) * fadeOut;
        if (nameA > 0) {
          ctx.globalAlpha = nameA * 0.85;
          ctx.fillStyle = "#dfe6ff";
          ctx.font = "italic 300 18px 'Cormorant Garamond', Garamond, Georgia, serif";
          ctx.textAlign = "center";
          ctx.fillText(cur.name, cur.x0 + cur.size / 2, cur.y0 + cur.size + 28);
          ctx.globalAlpha = 1;
        }
        ctx.globalCompositeOperation = "lighter";
        if (T >= total) { cur = null; nextIn = 4; }
      }

      // a rare shooting star
      if (!A.reduce && A.power !== "saver") {
        meteorIn -= dt;
        if (meteorIn <= 0) {
          meteorIn = rnd(18, 40);
          meteors.push({ x: rnd(W * 0.3, W * 1.1), y: rnd(H * 0.05, H * 0.4), vx: -rnd(280, 420), vy: rnd(120, 220), t: 0, life: 1.1 });
        }
      }
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.t += dt; m.x += m.vx * dt; m.y += m.vy * dt;
        if (m.t > m.life) { meteors.splice(i, 1); continue; }
        const q = Math.sin(Math.PI * m.t / m.life);
        const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 0.25, m.y - m.vy * 0.25);
        g.addColorStop(0, `rgba(255,255,255,${0.9 * q})`); g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.strokeStyle = g; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 0.25, m.y - m.vy * 0.25); ctx.stroke();
      }
      ctx.globalCompositeOperation = "source-over";
      drawMoon(ctx, t);
    },
  };
  Art.start(design);
})();
</script>
</body>
</html>
